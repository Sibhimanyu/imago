        var tl = gsap.timeline({ paused: true });

        var A1 = foot(960, 800);   // under "No account."
        var A2 = foot(1210, 430);  // stamped onto the x-height of "source"
        var A3 = foot(662, 305);   // on top of the F crossbar of "Free."

        // ---- Ground + phrase swaps: hard cuts on the beat. Ink ground on beats 2 and 4.
        tl.set(ink, { opacity: 0 }, 0);
        tl.set([p[1], p[2], p[3]], { opacity: 0 }, 0);
        tl.set(p[0], { opacity: 1 }, 0);
        for (var k = 1; k < 4; k++) {
          tl.set(p[k - 1], { opacity: 0 }, B[k]);
          tl.set(p[k], { opacity: 1 }, B[k]);
          tl.set(ink, { opacity: k % 2 ? 1 : 0 }, B[k]);
          tl.set(am, { color: k % 2 ? PAPER : INK }, B[k]);

        // Distinct arrivals, each done inside 0.12s so the phrase is read for its whole beat.
        tl.fromTo(p[0], { scale: 1.1 }, { scale: 1, duration: 0.1, ease: "power4.out" }, B[0]);

        // stamped: the phrase arrives pressed down under Amigo's impact and springs level (UI settle, power3)
        tl.fromTo(p[2], { y: 22, scaleY: 0.93 }, { y: 0, scaleY: 1, duration: 0.24, ease: "power3.out" }, B[2]);

        tl.set(spin, { rotation: 0 }, 0);

        tl.to(sq, { scaleX: 0.86, scaleY: 1.2, duration: 0.08, ease: "power2.out" }, HALF);
