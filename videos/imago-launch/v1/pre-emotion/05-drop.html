      (function () {
        var ID = "05-drop";

        var tl = gsap.timeline({ paused: true });

        // 128 bpm grid: frame-local beat n = n * 0.469 (beat 0 = the drop).

        // Deck geometry (card box 880x495 centred at DX, DY).

        var frac = function (v) { return v - Math.floor(v); };
        var prand = function (i, k) { return frac(Math.sin(i * 12.9898 + k * 78.233) * 43758.5453); };

        // Pile slots: index-derived offset + rotation (+-2..6 deg, alternating sign), rising as it grows.
        var pile = [];
        for (var i = 0; i < N; i++) {
          var sign = i % 2 ? 1 : -1;
          var rot = i === 0 ? -4 : sign * (2 + prand(i, 1) * 4);
          pile.push({ x: (prand(i, 2) - 0.5) * 44, y: -i * 8, r: rot, s: 1 });
        }
        // Fan slots: arc around a pivot below the deck.
        var FAN_S = 0.64, R = 1100, FAN_Y = 44;
        var fan = [];
        for (var j = 0; j < N; j++) {
          var a = -12.25 + 3.5 * j;
          fan.push({ x: -20 + R * Math.sin(a * DEG), y: FAN_Y + R * (1 - Math.cos(a * DEG)), r: a, s: FAN_S });
        }
        // Top-centre point of a card slot (where Amigo's feet go).
        var topOf = function (p) {
          var hh = (H / 2) * p.s;
          return { x: DX + p.x + hh * Math.sin(p.r * DEG), y: DY + p.y - hh * Math.cos(p.r * DEG), r: p.r };
        };

        var card = function (k) { return $("card-" + k); };
        var dim = function (k) { return $("dim-" + k); };

        // ---- Scene 1 (0.0s): the drop. Ink flips to paper, Pikachu slams in huge from below-front.
        tl.fromTo($("ink"), { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power2.out" }, 0);
        tl.fromTo(card(0),
          { x: pile[0].x + 120, y: 760, rotation: -12, scale: 1.45 },
          { x: pile[0].x, y: pile[0].y, rotation: pile[0].r, scale: 1, duration: 0.42, ease: "expo.out" }, 0);
        tl.fromTo($("l1"), { x: -160, scale: 1.25, opacity: 0 },
          { x: 0, scale: 1, opacity: 1, duration: 0.36, ease: "expo.out" }, 0);
        // hide the rest of the deck until its beat
        for (var h = 1; h < N; h++) tl.set(card(h), { opacity: 0 }, 0);

        // Deck impact dip on every landing (UI: power3 settle, no overshoot).

        };

        // ---- Scene 2 (beats 1-6): one card per beat from alternating sides, landing on the pile.
        for (var c = 1; c <= 6; c++) {
          var fromRight = c % 2 === 1;
          var land = beat(c);
          var p = pile[c];
          tl.set(card(c), { opacity: 1 }, land - 0.05);
          tl.fromTo(card(c),
            { x: p.x + (fromRight ? 1350 : -1350), y: p.y + 240, rotation: p.r + (fromRight ? 18 : -18), scale: 1.08 },
            { x: p.x, y: p.y, rotation: p.r, scale: 1, duration: 0.38, ease: "expo.out", immediateRender: false }, land - 0.05);
          tl.fromTo(dim(c - 1), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, land);
          dip(land, 10);
        }

        // "it returns." completes the headline on beat 2 (the third beat).
        tl.fromTo($("l2"), { y: 70, scale: 1.2, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.34, ease: "expo.out" }, beat(2) - 0.03);

        // ---- Amigo: rig = pos (x,y) > lean (surf) > spin > squash (feet-anchored).
