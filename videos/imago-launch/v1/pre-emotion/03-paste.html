  <script>
    (function () {
      const ID = "03-paste";
      const $ = (id) => document.getElementById("f03-" + id);
      const tl = gsap.timeline({ paused: true });
      const B = 0.469; // beat
      const H = 0.2345; // half beat (eighth note)
      const DUR = 3.75;
      const frac = (v) => v - Math.floor(v);
      const hash = (i) => frac(Math.sin(i * 12.9898) * 43758.5453);
      const FEET = "50% 93.75%";

      const bar = $("bar"), btn = $("btn"), cam = $("cam");
      const apos = $("apos"), abody = $("abody"), ashake = $("ashake");

      // ============ Scene 1 (0–0.94): bar slams in from the right; headline builds on beats 1–2 ============
      tl.fromTo(bar, { x: 1700, skewX: -14 }, { x: 0, skewX: 0, duration: 0.3, ease: "expo.out" }, 0);
      const words = document.querySelectorAll("#f03-head .f03-word");
      const wordAt = [H, B, B + H, B + H + H / 2];
      words.forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, wordAt[i]);
      });

      // ============ Scene 2 (0.94–1.875): URL types ~3 chars per frame-tick; Amigo belly-slides in ============
      const URL = "https://pokeapi.co/api/v2/pokemon/pikachu";
      const T_TYPE = 2 * B; // 0.938
      const TICK = 1 / 30;
      const T_TYPED = T_TYPE + Math.ceil(URL.length / 3) * TICK; // ≈ 1.405 (beat 4)
      const typed = $("typed"), caret = $("caret"), ph = $("placeholder");
      const drv = { t: 0 };
      tl.fromTo(drv, { t: 0 }, {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: () => {
          const t = drv.t;
          let n = 0;
          if (t >= T_TYPE) n = Math.min(URL.length, (Math.floor((t - T_TYPE) / TICK) + 1) * 3);
          typed.textContent = URL.substring(0, n);
          ph.style.opacity = t >= T_TYPE ? "0" : "1";
          const typing = t >= T_TYPE && t < T_TYPED;
          const blinkOn = Math.sin((t / 0.6) * Math.PI * 2) > -0.2;
          caret.style.opacity = t < 0.3 ? "0" : typing || blinkOn ? "1" : "0";
        },
      }, 0);

      // Amigo belly-slide: lying forward (rotated about the feet), riding the bar's top edge
      gsap.set([apos, abody], { transformOrigin: FEET });
      const T_POP = 3 * B; // beat 4 = 1.407
      tl.fromTo(apos, { x: -1700, y: -48, rotation: 82 }, { x: -40, y: -48, rotation: 82, duration: 0.31, ease: "power2.out" }, T_TYPE);
      tl.fromTo($("trail"), { x: -1700, opacity: 1 }, { x: -40, duration: 0.31, ease: "power2.out" }, T_TYPE);
      tl.to($("trail"), { opacity: 0, duration: 0.12, ease: "power1.out" }, T_TYPE + 0.26);
      // pop upright: flip up off the belly with a small hop, land on the button on beat 4
      tl.to(apos, { x: 0, rotation: -10, y: -110, duration: 0.1, ease: "power2.out" }, T_TYPE + 0.31);
      tl.to(apos, { rotation: 0, y: 0, duration: T_POP - (T_TYPE + 0.41), ease: "power2.in" }, T_TYPE + 0.41);
      tl.fromTo(abody, { scaleX: 1, scaleY: 1 }, { scaleX: 0.9, scaleY: 1.12, duration: 0.1, ease: "power2.out" }, T_TYPE + 0.31);
      tl.to(abody, { scaleX: 1, scaleY: 1, duration: T_POP - (T_TYPE + 0.41), ease: "power1.in" }, T_TYPE + 0.41);
      // landing squash + overshoot, the bar dips under the weight
      tl.to(abody, { scaleX: 1.2, scaleY: 0.78, duration: 0.06, ease: "power1.out" }, T_POP);
      tl.to(abody, { scaleX: 0.95, scaleY: 1.06, duration: 0.1, ease: "power2.out" }, T_POP + 0.06);
      tl.to(abody, { scaleX: 1, scaleY: 1, duration: 0.07, ease: "power2.inOut" }, T_POP + 0.16);
      tl.to(bar, { y: 6, duration: 0.06, ease: "power1.out" }, T_POP);
      tl.to(bar, { y: 0, duration: 0.3, ease: "power3.out" }, T_POP + 0.06);
      // groove: off-beat side-step lean, bob on the kick
      tl.to(apos, { x: 8, rotation: 5, duration: 0.11, ease: "power2.out" }, T_POP + H);
      tl.to(abody, { scaleX: 1.05, scaleY: 0.94, duration: 0.06, ease: "power1.out" }, T_POP + H);
      tl.to(abody, { scaleX: 1, scaleY: 1, duration: 0.1, ease: "power2.out" }, T_POP + H + 0.06);
      tl.to(apos, { x: 0, rotation: -3, duration: 0.12, ease: "power2.inOut" }, T_POP + H + 0.11);

      // ============ Scene 3 (1.875–3.28): charge-up on each eighth, tracking the filter build ============
      const T_CH = 4 * B; // 1.876
      const R = 7 * B; // beat 8 = 3.283, release
      // six eighth-note steps, then a sixteenth "crunch" right before the release
      const steps = [0, 1, 2, 3, 4, 5].map((k) => T_CH + k * H);
      steps.push(R - H / 2);
      const BTN_HALF = 52;

      // tension lines: one per step, alternating sides, climbing over Amigo
      const tlBox = $("tlines");
      const angles = [180, 0, 205, -25, 150, 30, -90];
      const CX = 1472, CY = 430, RAD = 150;
      const lineEls = angles.map((a, i) => {
        const w = document.createElement("div");
        w.className = "f03-tl";
        const rad = (a * Math.PI) / 180;
        w.style.left = CX + RAD * Math.cos(rad) + "px";
        w.style.top = CY + RAD * Math.sin(rad) + "px";
        w.style.transform = "rotate(" + a + "deg)";
        const inner = document.createElement("i");
        w.appendChild(inner);
        tlBox.appendChild(w);
        return inner;
      });

      steps.forEach((t, k) => {
        const n = k + 1;
        const s = 1 - 0.018 * n; // button press scale → 0.874
        const dy = 1.6 * n; // button sinks
        const feet = BTN_HALF * (1 - s) + dy; // how far the button's top moved
        const sy = 1 - 0.06 * n; // Amigo squash → 0.58
        const sx = 1 + 0.046 * n; // → 1.32
        const next = k < steps.length - 1 ? steps[k + 1] : R;
        const settle = Math.min(0.12, next - t - 0.05);
        // linear press on the button, Amigo rides it down
        tl.to(btn, { scale: s, y: dy, duration: 0.05, ease: "power1.in" }, t);
        tl.to(apos, { y: feet, x: 0, rotation: -1.5 * n, duration: 0.05, ease: "power1.in" }, t);
        // squash a notch lower (overshoot a hair, then hold the notch)
        tl.to(abody, { scaleX: sx * 1.03, scaleY: sy * 0.95, duration: 0.05, ease: "power1.in" }, t);
        tl.to(abody, { scaleX: sx, scaleY: sy, duration: settle, ease: "power2.out" }, t + 0.05);
        // camera punches in one notch per step, pinned on the button
        tl.to(cam, { scale: 1 + 0.009 * n, duration: 0.08, ease: "power2.out", transformOrigin: "1472px 572px" }, t);
        // a tension line snaps out
        tl.fromTo(lineEls[k], { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.1, ease: "power3.out" }, t);
      });

      // shiver: deterministic x-jitter that grows with the charge
      const shiver = { p: 0 };
      tl.fromTo(shiver, { p: 0 }, {
        p: 1,
        duration: R - (T_CH + H),
        ease: "none",
        immediateRender: false,
        onUpdate: () => {
          const k = Math.floor(shiver.p * 44);
          const amp = 1 + 6 * shiver.p * shiver.p;
          gsap.set(ashake, { x: (hash(k * 3 + 1) * 2 - 1) * amp });
        },
      }, T_CH + H);

      // ============ Scene 4 (3.28–3.75): release — launch, button springs back, "Press." slams ============
      tl.set(ashake, { x: 0 }, R);
      tl.to(abody, { scaleX: 0.58, scaleY: 1.75, duration: 0.07, ease: "power2.out" }, R);
      tl.to(abody, { scaleX: 0.66, scaleY: 1.9, duration: 0.3, ease: "power1.out" }, R + 0.07);
      tl.to(apos, { y: -1500, rotation: 0, duration: 0.47, ease: "power2.out" }, R + 0.02);

      // press-release spring: adjacent to the last press, back.out release
      tl.to(btn, { scale: 1, y: 0, duration: 0.46, ease: "back.out(2.6)" }, R);
      tl.fromTo($("btnflash"), { opacity: 0.95 }, { opacity: 0, duration: 0.32, ease: "power2.in", immediateRender: false }, R);
      tl.fromTo($("ring"), { scale: 1, opacity: 0.55 }, { scale: 2.3, opacity: 0, duration: 0.45, ease: "power2.out", transformOrigin: "50% 50%" }, R);

      // camera snaps back out and kicks
      tl.to(cam, { scale: 1, duration: 0.36, ease: "expo.out" }, R);
      tl.to(cam, { y: 14, duration: 0.04, ease: "power1.out" }, R);
      tl.to(cam, { y: 0, duration: 0.3, ease: "power3.out" }, R + 0.04);

      // tension lines burst outward
      lineEls.forEach((el) => {
        tl.to(el, { x: 90, scaleX: 0.4, opacity: 0, duration: 0.26, ease: "power2.out" }, R);
      });

      // speed lines streak up behind the launch
      ["sp0", "sp1", "sp2"].forEach((id, i) => {
        const el = $(id);
        tl.fromTo(el, { scaleY: 0, opacity: 1, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.1, ease: "power3.out" }, R + 0.02 + i * 0.02);
        tl.to(el, { scaleY: 0.2, transformOrigin: "50% 0%", opacity: 0, duration: 0.26, ease: "power2.in" }, R + 0.14 + i * 0.02);
      });

      // "Press." one-word slam on beat 8
      tl.fromTo($("press"), { opacity: 0, scale: 2.2, rotation: -6 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.2, ease: "expo.out" }, R);
      tl.to(bar, { y: 5, duration: 0.04, ease: "power1.out" }, R + 0.06);
      tl.to(bar, { y: 0, duration: 0.28, ease: "power3.out" }, R + 0.1);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
