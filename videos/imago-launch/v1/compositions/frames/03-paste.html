  <script>
    (function () {
      var FID = "03-paste";
      var DUR = 4;
      var scope = document.querySelector('[data-composition-id="' + FID + '"]') || document;
      function el(name) { return scope.querySelector('[id="' + FID + "-" + name + '"]'); }

      var bar = el("bar");
      var textEl = el("text");
      var caret = el("caret");
      var btn = el("btn");
      var ring = el("ring");
      var arrow = el("arrow");
      var amigo = el("amigo");
      var w1 = el("l1").querySelectorAll(".p03-w");
      var w2 = el("l2").querySelectorAll(".p03-w");

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–0.8): the GET bar rises from below and settles ----
      tl.fromTo(bar, { y: 260, scale: 0.97 }, { y: 0, scale: 1, duration: 0.8, ease: "expo.out" }, 0);
      tl.fromTo(bar, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);

      // ---- Scene 2 (0.8–2.2): URL types in mono (discrete-text-sequence) ----
      // Keystroke clusters with short pauses at the URL's natural breaks.
      var CHUNKS = [
        { s: "https://", t: 0.84, gap: 0.03 },
        { s: "pokeapi.co", t: 1.16, gap: 0.035 },
        { s: "/api/v2/", t: 1.56, gap: 0.03 },
        { s: "pokemon/", t: 1.86, gap: 0.025 },
        { s: "pikachu", t: 2.08, gap: 0.02 }
      ];
      var SEQUENCE = [{ t: 0, text: "" }];
      var acc = "";
      CHUNKS.forEach(function (c) {
        for (var i = 0; i < c.s.length; i++) {
          acc += c.s.charAt(i);
          SEQUENCE.push({ t: +(c.t + i * c.gap).toFixed(3), text: acc });
        }
      });
      var TYPE_START = 0.84;
      var TYPE_END = SEQUENCE[SEQUENCE.length - 1].t;

      function textAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }

      var driver = { t: 0 };
      tl.to(driver, {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          var t = driver.t;
          textEl.textContent = textAt(t);
          // Caret: solid while keys are landing, otherwise a beat-locked blink (1s period).
          var typing = t >= TYPE_START - 0.02 && t <= TYPE_END + 0.25;
          var on = typing || Math.sin(2 * Math.PI * t + 0.0001) >= 0;
          caret.style.opacity = on ? "1" : "0";
        }
      }, 0);

      // Beat 2 (1.0s): headline line 1 builds above
      tl.fromTo(w1, { yPercent: 55, opacity: 0, filter: "blur(10px)" },
        { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out", stagger: 0.08 }, 1.0);

      // ---- Scene 3 (2.2–3.0): Amigo hops in from the right edge, lands on the button at 2.5 ----
      gsap.set(amigo, { transformOrigin: "50% 93.75%" });
      tl.fromTo(amigo, { x: 470 }, { x: 0, duration: 0.3, ease: "power1.out" }, 2.2);
      tl.fromTo(amigo, { y: 70 }, { y: -200, duration: 0.16, ease: "power2.out" }, 2.2);
      tl.to(amigo, { y: 0, duration: 0.14, ease: "power2.in" }, 2.36);
      tl.fromTo(amigo, { rotation: -14, scaleX: 0.9, scaleY: 1.12 },
        { rotation: 0, scaleX: 0.94, scaleY: 1.08, duration: 0.3, ease: "sine.inOut" }, 2.2);
      // landing squash, anchored at the feet
      tl.to(amigo, { scaleX: 1.16, scaleY: 0.8, duration: 0.07, ease: "power2.out" }, 2.5);
      tl.to(amigo, { scaleX: 1, scaleY: 1, duration: 0.28, ease: "back.out(2.4)" }, 2.57);
      // the button takes the weight of the landing
      tl.to(btn, { y: 5, duration: 0.07, ease: "power2.out" }, 2.5);
      tl.to(btn, { y: 0, duration: 0.3, ease: "back.out(2)" }, 2.57);
      // anticipation: a small rise and stretch before the press
      tl.to(amigo, { y: -16, scaleX: 0.95, scaleY: 1.08, duration: 0.15, ease: "power2.out" }, 2.85);

      // ---- Scene 4 (3.0–4.0): beat 7 press (press-release-spring) ----
      var PRESS_START = 3.0, PRESS_DUR = 0.12, RELEASE_START = PRESS_START + PRESS_DUR, RELEASE_DUR = 0.55;
      // press: linear-feeling compression, Amigo squashes hard and rides the button down
      tl.to(btn, {
        y: 10, scale: 0.9,
        boxShadow: "0 2px 4px -2px rgba(27, 27, 25, 0.35)",
        duration: PRESS_DUR, ease: "power1.in"
      }, PRESS_START);
      tl.to(amigo, { y: 16, scaleX: 1.24, scaleY: 0.68, duration: PRESS_DUR, ease: "power1.in" }, PRESS_START);
      // release: spring back (start values == press end values by adjacency)
      tl.to(btn, {
        y: 0, scale: 1,
        boxShadow: "0 10px 22px -10px rgba(27, 27, 25, 0.45)",
        duration: RELEASE_DUR, ease: "back.out(2)"
      }, RELEASE_START);
      tl.to(amigo, { y: 0, scaleX: 1, scaleY: 1, duration: RELEASE_DUR, ease: "back.out(2.6)" }, RELEASE_START);
      // flash paper-white for one beat, then back to ink
      tl.to(btn, { backgroundColor: "#f6f5f1", color: "#1b1b19", duration: 0.06, ease: "none" }, RELEASE_START);
      tl.to(btn, { backgroundColor: "#1b1b19", color: "#f6f5f1", duration: 0.25, ease: "power1.inOut" }, RELEASE_START + 0.5);
      tl.fromTo(arrow, { x: 0 }, { x: 7, duration: 0.14, ease: "power2.out" }, RELEASE_START);
      tl.to(arrow, { x: 0, duration: 0.4, ease: "back.out(2)" }, RELEASE_START + 0.14);
      // release ring pops behind the button
      tl.fromTo(ring, { scale: 1, opacity: 0 }, { scale: 1.12, opacity: 0.55, duration: 0.06, ease: "none" }, RELEASE_START);
      tl.to(ring, { scale: 1.9, opacity: 0, duration: 0.55, ease: "power2.out" }, RELEASE_START + 0.06);

      // Beat 7 (3.0s): headline line 2 lands
      tl.fromTo(w2, { yPercent: 55, opacity: 0, filter: "blur(10px)" },
        { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out", stagger: 0.08 }, 3.0);

      // hold the read to the frame's end
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
