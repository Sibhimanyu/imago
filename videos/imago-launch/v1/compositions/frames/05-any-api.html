  <script>
    (function () {
      const ID = "05-any-api";
      const scope = document.querySelector('[data-composition-id="' + ID + '"]') || document;
      const $ = (sel) => scope.querySelector(sel);
      const $$ = (sel) => Array.from(scope.querySelectorAll(sel));

      const INK = "#1b1b19";
      const MUTED = "#a8a79f";
      const DURATION = 4.5;
      // 120 bpm grid: beat n lands at (n - 1) * 0.5s. Swaps on beat 3 and beat 6.
      const SWAP_WEATHER = 1.0;
      const SWAP_LIB = 2.5;
      const RESOLVE = 3.5;

      // ---- Temperature curve: 24 deterministic points, 25.1 → 34 (7th point) → 25.3
      const N = 24;
      const PEAK_I = 6;
      const temps = [];
      for (let i = 0; i < N; i++) {
        let v;
        if (i <= PEAK_I) {
          const u = i / PEAK_I;
          v = 25.1 + (34 - 25.1) * Math.sin((Math.PI / 2) * u) ** 2;
        } else {
          const u = (i - PEAK_I) / (N - 1 - PEAK_I);
          v = 25.3 + (34 - 25.3) * (1 + Math.cos(Math.PI * u)) / 2;
        }
        temps.push(v);
      }
      const W = 790, H = 170, PAD = 12;
      const LO = 24.6, HI = 34.4;
      const pts = temps.map((v, i) => [
        PAD + (i / (N - 1)) * (W - PAD * 2),
        PAD + (1 - (v - LO) / (HI - LO)) * (H - PAD * 2),
      ]);
      // Catmull-Rom → cubic Bézier for a smooth line through every point
      let d = "M" + pts[0][0].toFixed(2) + " " + pts[0][1].toFixed(2);
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i - 1)];
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const p3 = pts[Math.min(pts.length - 1, i + 2)];
        const c1x = p1[0] + (p2[0] - p0[0]) / 6;
        const c1y = p1[1] + (p2[1] - p0[1]) / 6;
        const c2x = p2[0] - (p3[0] - p1[0]) / 6;
        const c2y = p2[1] - (p3[1] - p1[1]) / 6;
        d += " C" + [c1x, c1y, c2x, c2y, p2[0], p2[1]].map((n) => n.toFixed(2)).join(" ");
      }
      const line = $("#f05-line");
      line.setAttribute("d", d);
      const peak = $("#f05-peak");
      peak.setAttribute("cx", pts[PEAK_I][0].toFixed(2));
      peak.setAttribute("cy", pts[PEAK_I][1].toFixed(2));
      const len = line.getTotalLength() * 1.02;
      line.style.strokeDasharray = String(len);
      line.style.strokeDashoffset = String(len);

      const tl = gsap.timeline({ paused: true });

      // ---- Timeline span driver (keeps the timeline exactly the frame length)
      tl.to({ v: 0 }, { v: 1, duration: DURATION, ease: "none" }, 0);

      // ---- Initial discrete states
      tl.set("#f05-p-poke", { autoAlpha: 1 }, 0);
      tl.set(["#f05-p-weather", "#f05-p-lib"], { autoAlpha: 0 }, 0);
      tl.set("#f05-lab-poke", { color: INK }, 0);
      tl.set(["#f05-lab-weather", "#f05-lab-lib"], { color: MUTED }, 0);

      // ---- Scene 1 (0–1.0): headline set on beat 1, Pikachu bars fill
      tl.fromTo("#f05-headline", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo(
        $$("#f05-p-poke .f05-fill"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out", stagger: 0.08 },
        0.12,
      );

      // ---- Amigo hop: anticipation squash → stretch + arc up → fall → land squash on the beat
      function hop(land, height) {
        const a = "#f05-amigo";
        tl.fromTo(a, { scaleX: 1, scaleY: 1, y: 0 }, { scaleX: 1.08, scaleY: 0.9, duration: 0.09, ease: "power2.out", immediateRender: false }, land - 0.45);
        tl.to(a, { y: -height, scaleX: 0.93, scaleY: 1.1, duration: 0.18, ease: "power2.out" }, land - 0.36);
        tl.to(a, { y: 0, scaleX: 0.97, scaleY: 1.04, duration: 0.18, ease: "power2.in" }, land - 0.18);
        tl.to(a, { scaleX: 1.12, scaleY: 0.86, duration: 0.06, ease: "power2.out" }, land);
        tl.to(a, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "back.out(2)" }, land + 0.06);
      }
      hop(SWAP_WEATHER, 70);
      hop(SWAP_LIB, 70);
      hop(RESOLVE, 36);

      // ---- Card punch on each hard cut (the shell settles; content swaps instantly)
      function punch(t) {
        tl.fromTo("#f05-card", { scale: 0.975 }, { scale: 1, duration: 0.28, ease: "power3.out", immediateRender: false }, t);
      }

      // ---- Scene 2 (1.0–2.5): hard cut to Chennai weather, line self-draws
      tl.set("#f05-p-poke", { autoAlpha: 0 }, SWAP_WEATHER);
      tl.set("#f05-p-weather", { autoAlpha: 1 }, SWAP_WEATHER);
      tl.set("#f05-lab-poke", { color: MUTED }, SWAP_WEATHER);
      tl.set("#f05-lab-weather", { color: INK }, SWAP_WEATHER);
      punch(SWAP_WEATHER);
      tl.fromTo(line, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.85, ease: "power2.out", immediateRender: false }, SWAP_WEATHER + 0.1);
      tl.fromTo("#f05-peak", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, SWAP_WEATHER + 0.35);
      tl.fromTo("#f05-foot", { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, SWAP_WEATHER + 0.9);

      // ---- Scene 3 (2.5–3.5): hard cut to Open Library, count up, rows cascade
      tl.set("#f05-p-weather", { autoAlpha: 0 }, SWAP_LIB);
      tl.set("#f05-p-lib", { autoAlpha: 1 }, SWAP_LIB);
      tl.set("#f05-lab-weather", { color: MUTED }, SWAP_LIB);
      tl.set("#f05-lab-lib", { color: INK }, SWAP_LIB);
      punch(SWAP_LIB);

      const countEl = $("#f05-count");
      const TARGET = 48232;
      const counter = { v: 0 };
      let lastShown = "";
      const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      tl.fromTo(
        counter,
        { v: 0 },
        {
          v: TARGET,
          duration: 0.7,
          ease: "power2.out",
          immediateRender: false,
          onUpdate: () => {
            const s = fmt(counter.v);
            if (s !== lastShown) {
              countEl.textContent = s;
              lastShown = s;
            }
          },
        },
        SWAP_LIB,
      );
      tl.fromTo(
        $$("#f05-p-lib .f05-row"),
        { autoAlpha: 0, y: 26 },
        { autoAlpha: 1, y: 0, duration: 0.36, ease: "power3.out", stagger: 0.12, immediateRender: false },
        SWAP_LIB + 0.15,
      );

      // ---- Scene 4 (3.5–4.5): every label turns ink together; Library card holds
      tl.set(["#f05-lab-poke", "#f05-lab-weather", "#f05-lab-lib"], { color: INK }, RESOLVE);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
