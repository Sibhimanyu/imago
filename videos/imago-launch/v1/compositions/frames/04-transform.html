  <script>
    (function () {
      const ID = "04-transform";
      const $ = (n) => document.getElementById(ID + "-" + n);
      const tl = gsap.timeline({ paused: true });
      const INK = "#1B1B19";

      // ---- Scene 1 (0.0–0.8): panel settles left, empty card frame scales 0.94 -> 1 ----
      tl.fromTo($("panel"), { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo($("card"), { scale: 0.94, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.8, ease: "power3.out" }, 0);

      // Slot content + ghosts start hidden via their own fromTo entrances below (immediateRender).

      // ---- Scene 2 (0.8–2.0): tokens lift out of the JSON and fly into their card slots ----
      tl.fromTo($("pre"), { opacity: 1 }, { opacity: 0.45, duration: 1.2, ease: "power1.inOut" }, 0.8);

      const PAD = 6; // ghost pill padding; content left = pill left + PAD * scale
      const D = 0.55;
      const ARC = 70;
      const CARD_X = 864, CARD_Y = 188;
      const flights = [
        // key, launch, token left/center-y, slot left/center-y (world), target scale, slot ids, label + skeleton ids
        { k: "name", at: 0.8, sx: 304, sy: 283, tx: CARD_X + 58, ty: CARD_Y + 86, s: 1.9, slot: "title", lbl: null, sk: ["sk-title"] },
        { k: "bx", at: 1.0, sx: 482.2, sy: 333, tx: CARD_X + 58, ty: CARD_Y + 257.5, s: 3.2, slot: "bx", lbl: "bxl", sk: ["sk-bx", "sk-bxl"] },
        { k: "ht", at: 1.25, sx: 336.4, sy: 383, tx: CARD_X + 360, ty: CARD_Y + 257.5, s: 3.2, slot: "ht", lbl: "htl", sk: ["sk-ht", "sk-htl"] },
      ];
      flights.forEach((f) => {
        const g = $("g-" + f.k);
        const gi = $("gi-" + f.k);
        // left-center anchor of the pill, before and after (content edge lands on the slot edge)
        const dx = (f.tx - PAD * f.s) - (f.sx - PAD);
        const dy = f.ty - f.sy;
        // lift out: the ghost is a copy; the source token stays in place (dimmed with the JSON)
        tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, f.at);
        // flight: eased travel + an upward arc on the inner layer
        tl.fromTo(g, { x: 0, y: 0, scale: 1, transformOrigin: "0% 50%" }, { x: dx, y: dy, scale: f.s, duration: D, ease: "power2.inOut" }, f.at);
        tl.fromTo(gi, { y: 0 }, { y: -ARC / f.s, duration: D / 2, ease: "sine.out" }, f.at);
        tl.to(gi, { y: 0, duration: D / 2, ease: "sine.in" }, f.at + D / 2);
        // morph (paint-only): dark mono pill dissolves into ink-on-white type
        tl.to(g, { backgroundColor: "rgba(27, 27, 25, 0)", boxShadow: "0 10px 24px -10px rgba(27, 27, 25, 0)", color: INK, duration: D * 0.45, ease: "power2.inOut" }, f.at + D * 0.45);
        tl.to(g, { opacity: 0, duration: D * 0.25, ease: "power1.in" }, f.at + D * 0.75);
        // slot resolves under the ghost
        f.sk.forEach((s) => tl.to($(s), { opacity: 0, duration: 0.2, ease: "power1.out" }, f.at + D * 0.55));
        tl.fromTo($(f.slot), { opacity: 0, scale: 0.9, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: D * 0.4, ease: "power2.out" }, f.at + D * 0.7);
        if (f.lbl) tl.fromTo($(f.lbl), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, f.at + D * 0.7);
      });

      // ---- Scene 3 (2.0–3.4): 112 counts up, stat rows fill one per half-beat, chip pops ----
      const bx = $("bx");
      const bxState = { v: 0 };
      tl.fromTo(bxState, { v: 0 }, {
        v: 112, duration: 1.8, ease: "power2.out",
        onUpdate: () => { bx.textContent = String(Math.round(bxState.v)); },
      }, 1.0 + D * 0.7);

      const STATS = [35, 55, 40, 50, 50, 90];
      STATS.forEach((val, i) => {
        const T = 2.0 + i * 0.25;
        const vEl = $("v" + i);
        const st = { v: 0 };
        tl.to($("sk-r" + i), { opacity: 0, duration: 0.2, ease: "power1.out" }, T);
        tl.fromTo($("rl" + i), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, T);
        tl.fromTo(vEl, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, T);
        tl.fromTo($("f" + i), { scaleX: 0 }, { scaleX: val / 90, duration: 0.5, ease: "power3.out" }, T);
        tl.fromTo(st, { v: 0 }, {
          v: val, duration: 0.5, ease: "power3.out",
          onUpdate: () => { vEl.textContent = String(Math.round(st.v)); },
        }, T);
      });

      tl.to($("sk-chip"), { opacity: 0, duration: 0.15, ease: "power1.out" }, 3.0);
      tl.fromTo($("chip"), { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 3.0);

      // ---- Scene 4 (3.4–4.5): Amigo drops onto the card's top edge on beat 8, squash + one settle ----
      const amigo = $("amigo");
      tl.fromTo(amigo, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 3.5);
      tl.fromTo(amigo, { y: -440, scaleX: 0.94, scaleY: 1.08, transformOrigin: "50% 100%" }, { y: 0, duration: 0.25, ease: "power2.in" }, 3.5);
      tl.to(amigo, { scaleX: 1.16, scaleY: 0.78, duration: 0.07, ease: "power1.out" }, 3.75);
      tl.to(amigo, { scaleX: 0.97, scaleY: 1.05, duration: 0.14, ease: "power2.out" }, 3.82);
      tl.to(amigo, { scaleX: 1, scaleY: 1, duration: 0.22, ease: "power2.inOut" }, 3.96);
      // the card takes the weight: a small dip and recover, then holds
      tl.to($("card"), { y: 5, duration: 0.07, ease: "power1.out" }, 3.75);
      tl.to($("card"), { y: 0, duration: 0.32, ease: "power2.out" }, 3.82);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
