  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DURATION = 3.5;
      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.0–1.0): floor, hop in on beat 1, land on beat 2 (0.5s) ----------
      tl.fromTo(
        "#cold-open-01-floor",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power3.out" },
        0,
      );

      // horizontal travel — ballistic, constant speed
      tl.fromTo("#cold-open-01-amigo-pos", { x: -700 }, { x: 0, duration: 0.5, ease: "none" }, 0);
      // vertical arc — rise, apex at 0.25, fall to the floor at 0.5
      tl.fromTo("#cold-open-01-amigo-hop", { y: 0 }, { y: -250, duration: 0.25, ease: "power2.out" }, 0);
      tl.to("#cold-open-01-amigo-hop", { y: 0, duration: 0.25, ease: "power2.in" }, 0.25);

      // squash & stretch, anchored at the feet
      tl.fromTo(
        "#cold-open-01-amigo-body",
        { scaleX: 0.86, scaleY: 1.18 },
        { scaleX: 1, scaleY: 1, duration: 0.22, ease: "power2.out" },
        0,
      );
      tl.to("#cold-open-01-amigo-body", { scaleX: 0.93, scaleY: 1.09, duration: 0.12, ease: "power1.in" }, 0.38);
      tl.to("#cold-open-01-amigo-body", { scaleX: 1.2, scaleY: 0.76, duration: 0.06, ease: "power2.out" }, 0.5);
      tl.to("#cold-open-01-amigo-body", { scaleX: 0.97, scaleY: 1.05, duration: 0.18, ease: "power2.out" }, 0.56);
      tl.to("#cold-open-01-amigo-body", { scaleX: 1, scaleY: 1, duration: 0.24, ease: "power2.inOut" }, 0.74);

      // in-flight tilt: leans back on take-off, forward into the landing, settles upright
      tl.fromTo(
        "#cold-open-01-amigo-lean",
        { rotation: -8 },
        { rotation: 6, duration: 0.45, ease: "sine.inOut" },
        0,
      );
      tl.to("#cold-open-01-amigo-lean", { rotation: 0, duration: 0.3, ease: "power3.out" }, 0.5);

      // ---------- Scene 2 (1.0–2.0): caret appears, line types, Amigo leans toward it ----------
      tl.to("#cold-open-01-amigo-lean", { rotation: 9, duration: 0.5, ease: "power3.inOut" }, 1.05);

      // ---------- Scene 3 (2.0–2.6): strike on beat 5, shrink up to muted ----------
      tl.fromTo(
        "#cold-open-01-strike",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.2, ease: "power2.inOut" },
        2.0,
      );
      // Amigo's small reaction dip on the strike
      tl.to("#cold-open-01-amigo-body", { scaleX: 1.04, scaleY: 0.93, duration: 0.1, ease: "power2.out" }, 2.0);
      tl.to("#cold-open-01-amigo-body", { scaleX: 1, scaleY: 1, duration: 0.3, ease: "power2.inOut" }, 2.1);
      // 6.2cqw -> 3cqw, top 22cqw -> 17cqw
      tl.fromTo(
        "#cold-open-01-l1",
        { scale: 1, y: 0, color: "#1b1b19" },
        { scale: 3 / 6.2, y: -96, color: "#a8a79f", duration: 0.4, ease: "power3.out" },
        2.15,
      );

      // ---------- Scene 4 (2.6–3.5): the correction types; lean holds (slow drift keeps it alive) ----------
      tl.to("#cold-open-01-amigo-lean", { rotation: 10.5, duration: 0.9, ease: "sine.inOut" }, 2.6);

      // ---------- typing + caret (discrete-text-sequence + context-sensitive-cursor) ----------
      var SEQ1 = [
        { t: 0, text: "" },
        { t: 1.1, text: "A" },
        { t: 1.16, text: "An" },
        { t: 1.22, text: "Ano" },
        { t: 1.29, text: "Anot" },
        { t: 1.35, text: "Anoth" },
        { t: 1.41, text: "Anothe" },
        { t: 1.47, text: "Another" },
        { t: 1.6, text: "Another " },
        { t: 1.7, text: "Another A" },
        { t: 1.77, text: "Another AP" },
        { t: 1.84, text: "Another API" },
        { t: 1.93, text: "Another API." },
      ];
      var SEQ2 = [
        { t: 0, text: "" },
        { t: 2.62, text: "Another " },
        { t: 2.72, text: "Another w" },
        { t: 2.77, text: "Another wa" },
        { t: 2.82, text: "Another wal" },
        { t: 2.87, text: "Another wall" },
        { t: 2.96, text: "Another wall\n" },
        { t: 3.01, text: "Another wall\no" },
        { t: 3.05, text: "Another wall\nof" },
        { t: 3.09, text: "Another wall\nof " },
        { t: 3.13, text: "Another wall\nof J" },
        { t: 3.16, text: "Another wall\nof JS" },
        { t: 3.19, text: "Another wall\nof JSO" },
        { t: 3.22, text: "Another wall\nof JSON" },
        { t: 3.29, text: "Another wall\nof JSON." },
      ];
      var C1_IN = 1.0, C1_OUT = 2.0, C2_IN = 2.5;
      var TYPING_GRACE = 0.15;
      var BLINK_CYCLES = 7; // 0.5s period — one blink per beat, whole number over 3.5s

      function textAt(seq, time) {
        for (var i = seq.length - 1; i >= 0; i--) {
          if (time >= seq[i].t) return seq[i].text;
        }
        return "";
      }
      function changeTimes(seq, extra) {
        var out = [extra];
        for (var i = 1; i < seq.length; i++) {
          if (seq[i].text !== seq[i - 1].text) out.push(seq[i].t);
        }
        return out;
      }
      var CH1 = changeTimes(SEQ1, C1_IN);
      var CH2 = changeTimes(SEQ2, C2_IN);
      function solid(ch, time) {
        for (var i = 0; i < ch.length; i++) {
          if (ch[i] <= time && time - ch[i] < TYPING_GRACE) return true;
        }
        return false;
      }

      var t1 = document.getElementById("cold-open-01-t1");
      var t2 = document.getElementById("cold-open-01-t2");
      var c1 = document.getElementById("cold-open-01-c1");
      var c2 = document.getElementById("cold-open-01-c2");

      function render(time) {
        t1.textContent = textAt(SEQ1, time);
        t2.textContent = textAt(SEQ2, time);
        var blinkOn = Math.sin((Math.PI * 2 * BLINK_CYCLES * time) / DURATION) < 0;
        var on1 = time >= C1_IN && time < C1_OUT && (solid(CH1, time) || blinkOn);
        var on2 = time >= C2_IN && (solid(CH2, time) || blinkOn);
        c1.style.opacity = on1 ? "1" : "0";
        c2.style.opacity = on2 ? "1" : "0";
      }

      var driver = { t: 0 };
      tl.fromTo(
        driver,
        { t: 0 },
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            render(driver.t);
          },
        },
        0,
      );
      render(0);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-cold-open"] = tl;
    })();
