    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "08-facts";
        var scope = document.querySelector('[data-composition-id="' + ID + '"]') || document;
        var $ = function (s) { return scope.querySelector("#f08-" + s); };

        var tl = gsap.timeline({ paused: true });

        // 128 bpm grid: frame-local beat n = n * 0.469. Four facts, one per beat.
        var BEAT = 0.469;
        var B = [0, BEAT, 2 * BEAT, 3 * BEAT];
        var PAPER = "#F6F5F1", INK = "#1B1B19";

        var ink = $("ink"), am = $("amigo"), lean = $("lean"), sq = $("squash"), ap = $("ap");
        var legs = [$("leg-l"), $("leg-r")];
        var p = [$("p1"), $("p2"), $("p3"), $("p4")];

        // Amigo is placed by his feet: box 150px, soles at 140.6px (legs end at y=30 of 32).
        var foot = function (fx, fy) { return { x: fx - 75, y: fy - 140.6 }; };
        var A = [
          foot(1380, 441),  // standing on the x-height of "browser"
          foot(960, 800),   // under "No account."
          foot(1210, 430),  // on the x-height of "source"
          foot(662, 305)    // on top of the F crossbar of "Free."
        ];

        // ---- Ground + phrase swaps: hard cuts on the beat. Ink ground (and a paper Amigo) on beats 2 and 4.
        tl.set(ink, { opacity: 0 }, 0);
        tl.set([p[1], p[2], p[3]], { opacity: 0 }, 0);
        tl.set(p[0], { opacity: 1 }, 0);
        tl.set(am, { x: A[0].x, y: A[0].y, color: INK }, 0);
        for (var k = 1; k < 4; k++) {
          tl.set(p[k - 1], { opacity: 0 }, B[k]);
          tl.set(p[k], { opacity: 1 }, B[k]);
          tl.set(ink, { opacity: k % 2 ? 1 : 0 }, B[k]);
          tl.set(am, { color: k % 2 ? PAPER : INK }, B[k]);
        }

        // Distinct arrivals, each done inside ~0.12s so the phrase is read for its whole beat.
        tl.fromTo(p[0], { scale: 1.1 }, { scale: 1, duration: 0.1, ease: "power4.out" }, B[0]);
        tl.fromTo(p[1], { x: -90 }, { x: 0, duration: 0.1, ease: "expo.out" }, B[1]);
        tl.fromTo(p[2], { y: 22, scaleY: 0.93 }, { y: 0, scaleY: 1, duration: 0.24, ease: "power3.out" }, B[2]);
        tl.fromTo(p[3], { scale: 1.5 }, { scale: 1, duration: 0.12, ease: "power4.out" }, B[3]);

        // ---- Amigo rig helpers. Every tween is an explicit fromTo from the tracked previous state.
        // Eye (aperture) state by size + gaze offset from the rest centre (16, 11.65).
        var E = function (w, h, rx, gx, gy) {
          return { x: 16 - w / 2 + (gx || 0), y: 11.65 - h / 2 + (gy || 0), width: w, height: h, rx: rx };
        };
        var REST = E(10.2, 5.3, 2.3);
        var eyeNow = REST;
        var eye = function (t, to, dur, ease) {
          tl.fromTo(ap, { attr: eyeNow }, { attr: to, duration: dur, ease: ease || "power2.inOut", immediateRender: false }, t);
          eyeNow = to;
        };
        var sqNow = { scaleX: 1, scaleY: 1 };
        var body = function (t, sx, sy, dur, ease) {
          var to = { scaleX: sx, scaleY: sy };
          tl.fromTo(sq, sqNow, { scaleX: sx, scaleY: sy, duration: dur, ease: ease || "power2.out", immediateRender: false }, t);
          sqNow = to;
        };
        var leanNow = 0;
        var tilt = function (t, r, dur, ease) {
          tl.fromTo(lean, { rotation: leanNow }, { rotation: r, duration: dur, ease: ease || "power2.inOut", immediateRender: false }, t);
          leanNow = r;
        };
        // A quick, clean move: small crouch, low arc, legs tuck (both equally, never spread), soft land.
        var move = function (i, t0, t1, lift) {
          var a = A[i], b = A[i + 1], d = t1 - t0, peak = Math.min(a.y, b.y) - lift;
          body(t0 - 0.04, 1.06, 0.94, 0.04, "power2.in");
          body(t0, 0.95, 1.05, 0.05, "power2.out");
          body(t0 + 0.05, 1, 1, d - 0.05, "sine.inOut");
          tl.fromTo(am, { x: a.x }, { x: b.x, duration: d, ease: "power2.inOut", immediateRender: false }, t0);
          tl.fromTo(am, { y: a.y }, { y: peak, duration: d * 0.45, ease: "power2.out", immediateRender: false }, t0);
          tl.fromTo(am, { y: peak }, { y: b.y, duration: d * 0.55, ease: "power2.in", immediateRender: false }, t0 + d * 0.45);
          tl.fromTo(legs, { y: 0 }, { y: -1.6, duration: d * 0.45, ease: "power2.out", immediateRender: false }, t0);
          tl.fromTo(legs, { y: -1.6 }, { y: 0, duration: d * 0.55, ease: "power2.in", immediateRender: false }, t0 + d * 0.45);
          // land on the beat: a small squash that settles to true proportions
          body(t1, 1.1, 0.91, 0.04, "power2.out");
          body(t1 + 0.04, 1, 1, 0.12, "back.out(2)");
        };

        tl.set(ap, { attr: REST }, 0);
        tl.set(sq, { scaleX: 1, scaleY: 1 }, 0);
        tl.set(lean, { rotation: 0 }, 0);
        tl.set(legs, { y: 0 }, 0);

        // ---- Beat 1 "Runs in your browser.": content. One blink that opens into a soft content squint, a little sway.
        var SQUINT = E(10.2, 2.0, 1.0);
        eye(0.06, E(10.2, 0.6, 0.3), 0.07, "power2.in");     // blink shut
        eye(0.13, SQUINT, 0.12, "power2.out");               // open into the content squint
        tilt(0.06, 4, 0.12, "sine.inOut");                   // contented sway
        tilt(0.18, -2, 0.1, "sine.inOut");
        tilt(0.28, 0, 0.05, "sine.out");
        move(0, 0.33, B[1], 36);

        // ---- Beat 2 "No account.": relieved. Eye pops wide, then a sigh: soft eye, slump, recover.
        var WIDE = E(11.6, 7.6, 3.2);
        var SOFT = E(10.2, 3.0, 1.4, 0, 0.35);
        eye(B[1], WIDE, 0.08, "power2.out");
        eye(0.6, SOFT, 0.14, "power2.inOut");
        body(0.63, 1, 0.92, 0.09, "power2.out");            // slump
        tilt(0.63, 5, 0.09, "power2.out");
        body(0.72, 1, 1, 0.06, "power2.inOut");              // recover to true proportions
        tilt(0.72, 0, 0.06, "power2.inOut");
        eye(0.78, REST, 0.08, "power2.inOut");
        move(1, 0.82, B[2], 30);

        // ---- Beat 3 "Open source.": curious. Head tilts, gaze drops to the word and scans along it.
        eye(0.99, E(10.2, 5.3, 2.3, -1.8, 1.4), 0.12, "power2.out");   // look down-left at "source"
        tilt(0.99, -9, 0.12, "power2.out");
        eye(1.12, E(10.2, 5.3, 2.3, 2.0, 1.4), 0.1, "power2.inOut");   // scan right along the word
        tilt(1.12, -6, 0.1, "power2.inOut");
        eye(1.23, REST, 0.06, "power2.out");
        tilt(1.23, 0, 0.06, "power2.out");
        move(2, 1.29, B[3], 44);

        // ---- Beat 4 "Free.": delighted. Happy squint and a proud puff (uniform 1.05 -> 1); ends in true proportions.
        eye(B[3] + 0.03, SQUINT, 0.09, "power2.out");
        body(1.57, 1.05, 1.05, 0.1, "power2.out");
        body(1.67, 1, 1, 0.14, "power2.inOut");

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
