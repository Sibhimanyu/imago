        var words = Array.prototype.slice.call($("tagline").children);

        // ---- geometry (viewBox 0 0 32 32). Every path shares one command layout so GSAP interpolates it number by number.
        var f = function (n) { return (Math.round(n * 1000) / 1000).toString(); };
        // closed shape: start point, then [line end, c1, c2, curve end] x 4
        var shape = function (pts) {
          var d = "M " + f(pts[0]) + " " + f(pts[1]);
          for (var i = 2; i < pts.length; i += 8) {
            d += " L " + f(pts[i]) + " " + f(pts[i + 1]) +
                 " C " + f(pts[i + 2]) + " " + f(pts[i + 3]) + " " + f(pts[i + 4]) + " " + f(pts[i + 5]) + " " + f(pts[i + 6]) + " " + f(pts[i + 7]);
          }
          return d + " Z";
        };
        // rounded window with the source aperture's handle ratio (1.4 of 2.3)
        var win = function (x, y, w, h, r) {
          r = Math.min(r, h / 2, w / 2);
          var k = r * (1.4 / 2.3), X = x + w, Y = y + h;
          return shape([
            x + r, y,
            X - r, y,  X - r + k, y,  X, y + r - k,  X, y + r,
            X, Y - r,  X, Y - r + k,  X - r + k, Y,  X - r, Y,
            x + r, Y,  x + r - k, Y,  x, Y - r + k,  x, Y - r,
            x, y + r,  x, y + r - k,  x + r - k, y,  x + r, y
          ]);
        };

        // Amigo body (rig v2 outer shape), started at the bottom of its left edge.
        var AMIGO_BODY = shape([6, 19.3,  6, 10.3, 6, 5.9, 8.6, 3, 13, 3,  19, 3, 23.4, 3, 26, 5.9, 26, 10.3,
          26, 19.3, 26, 23.5, 23.3, 26, 19.1, 26,  12.9, 26, 8.7, 26, 6, 23.5, 6, 19.3]);
        // The mark body (assets/imago-mark.svg), mapped back by -90 deg about (15.8, 16.8): (x, y) -> (y - 1, 32.6 - x).
        var MARK_BODY = [13.6, 6.4,  21.6, 6.4, 26, 6.4, 28.6, 9.3, 28.6, 13.7,  28.6, 20.8, 28.6, 25, 25.9, 27.6, 21.7, 27.6,
          13.6, 27.6, 9.8, 27.6, 7.6, 25.3, 7.6, 21.5,  7.6, 12.5, 7.6, 8.7, 9.8, 6.4, 13.6, 6.4];
        var back = [];
        for (var i = 0; i < MARK_BODY.length; i += 2) { back.push(MARK_BODY[i + 1] - 1, 32.6 - MARK_BODY[i]); }
        var LOCAL_BODY = shape(back);

        // Aperture states (rig v2), and the mark's tall window mapped back (19.1,12.6 5.3x9 -> 11.6,8.2 9x5.3).
        var EYE = {
          rest:   win(10.9, 9, 10.2, 5.3, 2.3),
          wide:   win(10.2, 7.85, 11.6, 7.6, 3.2),
          wideR:  win(11.2, 8.35, 11.6, 7.6, 3.2),   // wide, glancing toward the landing spot
          squint: win(10.9, 10.65, 10.2, 2.0, 1.0),
          blink:  win(10.9, 11.35, 10.2, 0.6, 0.3),
          mark:   win(11.6, 8.2, 9, 5.3, 2.3)
        };
        // Legs -> field bars, mapped back: bar1 (4.2,6.4 12.8x6) -> (5.4,15.6 6x12.8); bar2 (3,14.3 11.5x6) -> (13.3,18.1 6x11.5)
        var LEG_L = { x: 9, y: 21.5, width: 6, height: 8.5 }, BAR_1 = { x: 5.4, y: 15.6, width: 6, height: 12.8 };
        var LEG_R = { x: 17, y: 21.5, width: 6, height: 8.5 }, BAR_2 = { x: 13.3, y: 18.1, width: 6, height: 11.5 };

        body.setAttribute("d", AMIGO_BODY);
        ap.setAttribute("d", EYE.wide);

        var tl = gsap.timeline({ paused: true });

        // ---- Beat 1 (0.0 -> 0.469): Amigo flies in from off-frame upper left on an eased arc, one spin, eye wide.
        var T_LAND = B;
        tl.fromTo(mark, { opacity: 0 }, { opacity: 0, duration: 0.001 }, 0);
        tl.fromTo(fly, { opacity: 1, x: -1000 }, { opacity: 1, x: 0, duration: T_LAND, ease: "power2.out" }, 0);
        tl.fromTo(fly, { y: -300 }, { y: 0, duration: T_LAND, ease: "power1.inOut" }, 0);
        tl.fromTo(spin, { rotation: 0 }, { rotation: 360, duration: T_LAND - 0.03, ease: "power1.inOut" }, 0);
        tl.set(spin, { rotation: 0 }, T_LAND);
        tl.fromTo(lie, { attr: { transform: "rotate(0 15.8 16.8)" } }, { attr: { transform: "rotate(0 15.8 16.8)" }, duration: 0.001 }, 0);
        tl.fromTo(body, { attr: { d: AMIGO_BODY } }, { attr: { d: AMIGO_BODY }, duration: 0.001 }, 0);
        tl.fromTo(legL, { attr: LEG_L }, { attr: LEG_L, duration: 0.001 }, 0);
        tl.fromTo(legR, { attr: LEG_R }, { attr: LEG_R, duration: 0.001 }, 0);
        // stretched by the launch, true proportions mid-air, stretch into the drop
        tl.fromTo(sq, { scaleX: 0.9, scaleY: 1.1 }, { scaleX: 1, scaleY: 1, duration: 0.2, ease: "power2.out" }, 0);
        tl.fromTo(sq, { scaleX: 1, scaleY: 1 }, { scaleX: 0.93, scaleY: 1.07, duration: 0.1, ease: "power2.in", immediateRender: false }, T_LAND - 0.1);
        // eye: wide with excitement, glancing at the target, then wide-centred for the touchdown
        tl.fromTo(ap, { attr: { d: EYE.wide } }, { attr: { d: EYE.wideR }, duration: 0.14, ease: "power2.inOut" }, 0.12);
        tl.fromTo(ap, { attr: { d: EYE.wideR } }, { attr: { d: EYE.wide }, duration: 0.12, ease: "power2.inOut", immediateRender: false }, 0.32);

        // ---- Beat 2 (0.469 -> 0.938): lands on the mark's spot, satisfied squint, tiny blink, then lies down and becomes the mark.
        tl.fromTo(sq, { scaleX: 1.24, scaleY: 0.8 }, { scaleX: 1, scaleY: 1, duration: 0.15, ease: "back.out(1.8)", immediateRender: false }, T_LAND);
        tl.fromTo(ap, { attr: { d: EYE.wide } }, { attr: { d: EYE.squint }, duration: 0.07, ease: "power2.out", immediateRender: false }, T_LAND);
        tl.fromTo(ap, { attr: { d: EYE.squint } }, { attr: { d: EYE.blink }, duration: 0.04, ease: "power2.in", immediateRender: false }, T_LAND + 0.1);
        tl.fromTo(ap, { attr: { d: EYE.blink } }, { attr: { d: EYE.rest }, duration: 0.07, ease: "power2.out", immediateRender: false }, T_LAND + 0.14);

        // Lie down: 90 deg clockwise (aperture swings right, legs left) while each part morphs into its mark part.
        var T_MORPH = T_LAND + 0.2, D_MORPH = 2 * B - T_MORPH; // ends on beat 3 (0.938)
        var EASE = "power3.inOut";
        tl.fromTo(lie, { attr: { transform: "rotate(0 15.8 16.8)" } }, { attr: { transform: "rotate(90 15.8 16.8)" }, duration: D_MORPH, ease: EASE, immediateRender: false }, T_MORPH);
        tl.fromTo(body, { attr: { d: AMIGO_BODY } }, { attr: { d: LOCAL_BODY }, duration: D_MORPH, ease: EASE, immediateRender: false }, T_MORPH);
        tl.fromTo(ap, { attr: { d: EYE.rest } }, { attr: { d: EYE.mark }, duration: D_MORPH, ease: EASE, immediateRender: false }, T_MORPH);

        tl.fromTo(legR, { attr: LEG_R }, { attr: BAR_2, duration: D_MORPH - 0.05, ease: EASE, immediateRender: false }, T_MORPH + 0.05);

        tl.fromTo(mark, { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: false }, 2 * B);
        tl.fromTo(fly, { opacity: 1 }, { opacity: 0, duration: 0.001, immediateRender: false }, 2 * B);

        letters.forEach(function (el, i) {

        words.forEach(function (el, i) {

        tl.fromTo(pill, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "power3.out" }, 2 * B + H + H / 2);
