    <script>
      (function () {
        var ID = "07-watch";
        var scope = document.querySelector('[data-composition-id="' + ID + '"]') || document;
        var $ = function (s) { return scope.querySelector("#f07-" + s); };

        var tl = gsap.timeline({ paused: true });

        // 128 bpm grid, frame-local: beat n (1-indexed) = (n - 1) * 0.469.
        var BEAT = 0.469, HALF = 0.2345;
        var beat = function (n) { return (n - 1) * BEAT; };

        // ---- Scene 1 (0.0-0.94s): the Forecast window slides in tilted and settles flat.
        tl.fromTo($("win"),
          { x: 760, y: 40, rotationY: -26, rotationX: 8, rotation: 3, transformPerspective: 1800 },
          { x: 0, y: 0, rotationY: 0, rotationX: 0, rotation: 0, transformPerspective: 1800, duration: 0.62, ease: "expo.out" }, 0);
        tl.fromTo($("l1"), { x: -140, scale: 1.2, opacity: 0 },
          { x: 0, scale: 1, opacity: 1, duration: 0.36, ease: "expo.out" }, 0.06);
        tl.fromTo($("l2"), { y: 60, scale: 1.15, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.34, ease: "expo.out" }, beat(2));

        // ---- Scene 2 (0.94-1.875s): coordinate-target-zoom onto the Watch switch + Live pill.
        // Target = window-local (690, 30) -> canvas (1350, 200); offset from centre (390, -340); T = -offset.
        var ZS = 1.65, ZX = -390, ZY = 340;
        tl.fromTo($("camo"), { scale: 1 }, { scale: ZS, duration: 0.55, ease: "power3.inOut" }, 0.62);
        tl.fromTo($("cami"), { x: 0, y: 0 }, { x: ZX, y: ZY, duration: 0.55, ease: "power3.inOut" }, 0.62);
        // beat 3: the switch flips on -> the Watch capture (switch ON, 30s, Live . 27s)
        tl.fromTo($("shot-on"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, beat(3));
        // camera punctuates the flip (tiny push, re-locks)
        tl.to($("camo"), { scale: ZS * 1.025, duration: 0.08, ease: "power2.out" }, beat(3));
        tl.to($("camo"), { scale: ZS, duration: 0.2, ease: "power3.out" }, beat(3) + 0.08);

        // ---- Scene 3 (1.875-3.28s): pull back to the whole window, values change.
        tl.to($("camo"), { scale: 1, duration: 0.44, ease: "power3.inOut" }, beat(5) - 0.44);
        tl.to($("cami"), { x: 0, y: 0, duration: 0.44, ease: "power3.inOut" }, beat(5) - 0.44);

        // Live countdown ticks (one per ~second, on off-beats)
        tl.set($("patch-l"), { opacity: 1 }, beat(3) + 0.1);
        tl.to($("col-l"), { y: -18, duration: 0.18, ease: "power3.out" }, beat(5) + HALF);
        tl.to($("col-l"), { y: -36, duration: 0.18, ease: "power3.out" }, beat(7) + HALF);

        // a value flips: tint + patch colour in lockstep (multiply over white == the tint colour), digit rolls up
        var flip = function (key, t) {
          tl.fromTo($("tint-" + key), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, t);
          tl.set($("patch-" + key), { opacity: 1 }, t);
          tl.fromTo($("patch-" + key), { backgroundColor: "#FFFFFF" },
            { backgroundColor: "#FDF3CD", duration: 0.16, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo($("col-" + key), { y: 0 }, { y: -82, duration: 0.26, ease: "power3.out", immediateRender: false }, t);
        };
        flip("t", beat(5));
        tl.fromTo($("tag"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power3.out" }, beat(5) + 0.04);
        flip("h", beat(6));

        // interval chips pop under the headline on beat 6
        for (var c = 0; c < 3; c++) {
          tl.fromTo($("chip-" + c), { y: 26, scale: 0.8, opacity: 0 },
            { y: 0, scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, beat(6) + c * 0.06);
        }

        // beat 7: "Changed" pill pops beside the Live pill, count rolls 1 -> 3 on sixteenths
        tl.fromTo($("chg"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.26, ease: "power3.out" }, beat(7));
        tl.fromTo($("chgcol"), { y: 0 }, { y: -16, duration: 0.1, ease: "power3.out", immediateRender: false }, beat(7) + 0.117);
        tl.to($("chgcol"), { y: -32, duration: 0.1, ease: "power3.out" }, beat(7) + HALF);

        // ---- Amigo (rig v2: the aperture is its eye; body language, not hops)
        var amigo = $("amigo"), step = $("step"), lean = $("lean"), sq = $("squash");
        var ap = $("ap"), legL = $("legL"), legR = $("legR");
        // Every tween is an explicit fromTo from the tracked state (authored in time order per element).
        var S = {
          amigo: { el: amigo, v: { y: -420 } }, step: { el: step, v: { x: 0 } },
          lean: { el: lean, v: { rotation: 0 } }, sq: { el: sq, v: { scaleX: 0.84, scaleY: 1.2 } },
          legL: { el: legL, v: { y: 0 } }, legR: { el: legR, v: { y: 0 } },
          ap: { el: ap, v: { x: 10.9, y: 9, width: 10.2, height: 5.3, rx: 2.3 }, attr: true }
        };
        var mv = function (key, to, t, d, ease) {
          var o = S[key], from = {}, dest = {}, k;
          for (k in to) { from[k] = o.v[k]; dest[k] = to[k]; o.v[k] = to[k]; }
          var vars = { duration: d, ease: ease || "power2.inOut", immediateRender: false };
          if (o.attr) { tl.fromTo(o.el, { attr: from }, Object.assign({ attr: dest }, vars), t); }
          else { tl.fromTo(o.el, from, Object.assign(dest, vars), t); }
        };
        // eye(t, d, w, h, rx, gazeX, gazeY): the aperture keeps its centre at rest (16, 11.65) + gaze
        var eye = function (t, d, w, h, rx, gx, gy, ease) {
          mv("ap", { x: 16 + gx - w / 2, y: 11.65 + gy - h / 2, width: w, height: h, rx: rx }, t, d, ease);
        };
        var sqz = function (sx, sy, t, d, ease) { mv("sq", { scaleX: sx, scaleY: sy }, t, d, ease); };

        // Scene 2: drops onto the Live pill (eye wide, looking down at the landing), the window dips on impact
        var LAND = beat(3) + HALF;
        tl.set(amigo, { opacity: 1 }, LAND - 0.26);
        mv("amigo", { y: 0 }, LAND - 0.26, 0.26, "power3.in");
        sqz(0.9, 1.12, LAND - 0.26, 0.22, "none");
        eye(LAND - 0.26, 0.1, 11.2, 6.8, 3.0, 0, 1.2, "power2.out");
        sqz(1.3, 0.7, LAND, 0.05, "power2.out");
        sqz(1, 1, LAND + 0.05, 0.17, "back.out(2.4)");
        eye(LAND, 0.04, 10.2, 0.5, 0.25, 0, 0.4, "power2.out");            // shut on impact
        eye(LAND + 0.06, 0.1, 10.2, 5.3, 2.3, 0, 0, "power2.out");        // pops open
        tl.fromTo($("win"), { y: 5 }, { y: 0, duration: 0.24, ease: "power3.out", immediateRender: false }, LAND);

        // settles into "watching": eye narrowed, gaze fixed down-left on the Temperature value, leaning in
        var WATCH = { w: 9.6, h: 3.0, rx: 1.4, gx: -2.2, gy: 1.1 };
        eye(1.34, 0.2, WATCH.w, WATCH.h, WATCH.rx, WATCH.gx, WATCH.gy);
        mv("lean", { rotation: -4 }, 1.33, 0.25, "power2.out");
        sqz(1.06, 0.94, beat(4), 0.06, "power2.out");                    // groove: small bob on the kick
        sqz(1, 1, beat(4) + 0.06, 0.16, "power2.out");
        mv("step", { x: 3 }, beat(4) + HALF - 0.07, 0.14);               // off-beat side-step
        // a slow blink while it watches
        eye(1.58, 0.09, WATCH.w, 0.5, 0.25, WATCH.gx, WATCH.gy, "power2.in");
        eye(1.72, 0.13, WATCH.w, WATCH.h, WATCH.rx, WATCH.gx, WATCH.gy, "power2.out");

        // Change 1 (30.1 -> 30.4): startled WIDE eye snaps to the value, a tiny jolt + recoil, then leans in
        var C1 = beat(5);
        eye(C1, 0.06, 11.6, 7.6, 3.2, -2.2, 1.2, "power2.out");
        mv("amigo", { y: -7 }, C1, 0.06, "power2.out");
        mv("amigo", { y: 0 }, C1 + 0.06, 0.1, "power2.in");
        sqz(0.95, 1.06, C1, 0.06, "power2.out");
        sqz(1, 1, C1 + 0.06, 0.14, "power2.out");
        mv("legL", { y: -0.8 }, C1, 0.06, "power2.out");
        mv("legR", { y: -0.8 }, C1, 0.06, "power2.out");
        mv("legL", { y: 0 }, C1 + 0.06, 0.1, "power2.in");
        mv("legR", { y: 0 }, C1 + 0.06, 0.1, "power2.in");
        mv("lean", { rotation: 3 }, C1, 0.06, "power2.out");
        mv("lean", { rotation: -6 }, C1 + 0.12, 0.22, "power2.out");
        var jit = [5, 0, 3, -1, -2];                                     // deterministic tremble, ends side-stepped
        for (var i = 0; i < jit.length; i++) { mv("step", { x: jit[i] }, C1 + 0.16 + i * 0.025, 0.025, "none"); }
        eye(C1 + 0.28, 0.14, 10.2, 5.3, 2.3, -2.2, 1.1);                 // relaxes, still staring at it

        // Change 2 (67 -> 66): gaze whips to humidity, wide again, then a knowing squint + nod + foot tap
        var C2 = beat(6);
        eye(C2, 0.07, 11.6, 7.6, 3.2, -0.6, 1.4, "power2.out");
        mv("lean", { rotation: -2 }, C2, 0.1, "power2.out");
        mv("step", { x: 1 }, C2, 0.1, "power2.out");
        eye(C2 + 0.23, 0.14, 10.2, 2.0, 1.0, -0.6, 1.0);
        mv("lean", { rotation: -5 }, C2 + 0.23, 0.1, "power2.out");
        mv("lean", { rotation: -2 }, C2 + 0.33, 0.13, "power2.inOut");
        mv("legR", { y: -1.4 }, C2 + 0.25, 0.06, "power2.out");
        mv("legR", { y: 0 }, C2 + 0.31, 0.08, "power2.in");

        // "Changed 3": looks down at the pill, delighted squint, perks up, happy feet on the count
        var C3 = beat(7);
        eye(C3, 0.1, 10.2, 5.3, 2.3, 0, 1.4, "power2.out");
