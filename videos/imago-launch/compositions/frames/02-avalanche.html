          var sc = scrollAt(t), S = sc.s;
          var d = sc.v * LH / 30;                              // px travelled per frame
          var blurY = Math.min(26, Math.max(0, d - 22) * 0.2);
          var stretch = 1 + Math.min(0.8, Math.max(0, d - 40) / 420);
          var fade = 1 - 0.28 * Math.min(1, Math.max(0, d - 40) / 900);
          var counterOn = t >= T2;

          var base = Math.floor(S);
          for (var k = 0; k < POOL; k++) {
            var n = base + SLOT0 + k + 1;
            var y = TOPPAD + (n - 1 - S) * LH;
            var row = rows[k];
            if (n < 1 || n > TOTAL || y < -LH || y > PLANE_H) { row.style.display = "none"; continue; }
            row.style.display = "block";
            row.style.transform = "translate(0px," + y.toFixed(2) + "px) scaleY(" + stretch.toFixed(3) + ")";
            if (shown[k] !== n) { txt[k].innerHTML = lineHTML(n); gut[k].textContent = String(n); shown[k] = n; }
            var underCounter = counterOn && y > REF_Y - 0.5 * LH && y < REF_Y + 2.4 * LH;
            gut[k].style.opacity = underCounter ? "0" : "1";
          }
          code.style.opacity = fade.toFixed(3);
          if (blurY > 0.2) {
            blurNode.setAttribute("stdDeviation", "0 " + blurY.toFixed(2));
            code.style.filter = "url(#f02-vblur)";
          } else {
            blurNode.setAttribute("stdDeviation", "0 0");
            code.style.filter = "none";
          }

          // The physical sheet: its top edge scrolls away, its bottom edge arrives with line 15411.
          var top = TOPPAD - EDGE_PAD - S * LH;
          var bot = TOPPAD + (TOTAL - S) * LH + BOTTOM_PAD;
          top = Math.max(-60, top);
          bot = Math.min(PLANE_H + 60, bot);
          sheet.style.top = top.toFixed(2) + "px";
          sheet.style.height = Math.max(0, bot - top).toFixed(2) + "px";

          // The big line counter reads the true number on the active row.
          counter.textContent = String(Math.min(TOTAL, Math.round(S + K_END + 1)));

          // Amigo rides the top edge until it's yanked away, then streaks with the speed while airborne.
          ride.style.transform = "translate(0px," + (-Math.min(S, S_LEAVE) * LH).toFixed(2) + "px)";
          var airborne = t > T_LEAVE && t < T_LAND;
          var sp = airborne ? Math.min(1, Math.log(1 + sc.v) / Math.log(1 + 5 * A / TA)) : 0;
          var sy = 1 + 0.34 * sp * sp;
          streak.style.transform = "scale(" + (1 / Math.sqrt(sy)).toFixed(3) + "," + sy.toFixed(3) + ")";
        };

        var tl = gsap.timeline({ paused: true });
        var proxy = { t: 0 };
        render(0);
        tl.fromTo(proxy, { t: 0 }, {
          t: HOLD_END, duration: HOLD_END, ease: "none", immediateRender: false,
          onUpdate: function () { render(proxy.t); }
        }, 0);

        // ---- Camera: static read, a push into the rush, a snap back on the brake.
        var plane = $("plane"), cam = $("cam"), thud = $("thud");
        gsap.set(plane, { rotationX: 14, rotationZ: -3, transformOrigin: "50% 40%" });
        tl.fromTo(cam, { scale: 1, y: 0 }, { scale: 1.07, y: 18, duration: TA, ease: "power3.in", immediateRender: false }, T2);
        tl.fromTo(cam, { scale: 1.07, y: 18 }, { scale: 1, y: 0, duration: TB, ease: "power4.out", immediateRender: false }, T6);

        // ---- Beat 1: the source chip.
        tl.fromTo($("chip"), { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.02);

        // ---- Beat 2: the active row + the counter grow out of the gutter.
        tl.fromTo($("band"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, T2);
        tl.fromTo(counter, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out", immediateRender: false }, T2);

        // ---- Amigo rig. Feet point (fx, fy) in plane space; the box is 170px with feet at 159px.
        var pos = $("pos"), lean = $("lean"), spin = $("spin"), sq = $("squash");
        var FX = 85, FY = 159;
        var EDGE0 = TOPPAD - EDGE_PAD;
        var P0 = { x: 700, y: EDGE0 };
        var RIDE = S_LEAVE * LH;                  // the ride wrapper keeps this lift after the edge leaves
        var LAND = { x: 1070, y: REF_Y + 38 + RIDE };  // feet on the "}" row's baseline
        gsap.set(pos, { x: P0.x - FX, y: P0.y - FY });
        gsap.set(sq, { scaleX: 1.4, scaleY: 0.25 });

        // Beat 1.5: pops back up out of frame 01's pancake.
        tl.fromTo(sq, { scaleX: 1.4, scaleY: 0.25 }, { scaleX: 0.82, scaleY: 1.26, duration: 0.1, ease: "power2.out", immediateRender: false }, beat(1.5));
        tl.to(sq, { scaleX: 1, scaleY: 1, duration: 0.2, ease: "back.out(2.2)" }, beat(1.5) + 0.1);

        // Beat 2: bob on the kick as the page starts to creep; teeters.
        tl.to(sq, { scaleX: 1.12, scaleY: 0.88, duration: 0.06, ease: "power2.out" }, T2);
        tl.to(sq, { scaleX: 1, scaleY: 1, duration: 0.14, ease: "power2.out" }, T2 + 0.06);
        tl.fromTo(lean, { rotation: 0 }, { rotation: -8, duration: 0.11, ease: "power2.out", immediateRender: false }, T2);
        tl.to(lean, { rotation: 10, duration: 0.11, ease: "power2.inOut" }, T2 + 0.12);

        // Beat 2.5: the edge is yanked away. Cartoon hang: a stretch of alarm, legs-out flail.
        tl.to(sq, { scaleX: 0.86, scaleY: 1.18, duration: 0.08, ease: "power2.out" }, T_LEAVE);
        tl.fromTo(pos, { y: P0.y - FY }, { y: P0.y - FY - 16, duration: 0.14, ease: "power2.out", immediateRender: false }, T_LEAVE);
        var FLAIL = [-14, 12, -16, 14];
        for (var f = 0; f < FLAIL.length; f++) {
          tl.to(lean, { rotation: FLAIL[f], duration: 0.055, ease: "sine.inOut" }, T_LEAVE + 0.02 + f * 0.055);
        }
        tl.to(lean, { rotation: 0, duration: 0.1, ease: "power2.out" }, beat(3));

        // Beats 3-6: the tumble. Falls and drifts across the page while the lines rush past.
        var T3 = beat(3), FALL = T6 - T3;
        var MIDP = { x: 1200, y: 640 + RIDE };
        tl.to(pos, { x: MIDP.x - FX, duration: FALL, ease: "sine.inOut" }, T3);
        tl.to(pos, { y: MIDP.y - FY, duration: FALL, ease: "power1.inOut" }, T3);
        tl.fromTo(spin, { rotation: 0 }, { rotation: -600, duration: FALL, ease: "power2.in", immediateRender: false }, T3);
        var FLAPS = [beat(3.5), beat(4), beat(4.5), beat(5), beat(5.5)];
        for (var p = 0; p < FLAPS.length; p++) {
          var wide = p % 2 === 0;
          tl.to(sq, { scaleX: wide ? 1.16 : 0.86, scaleY: wide ? 0.86 : 1.16, duration: 0.1, ease: "sine.inOut" }, FLAPS[p]);
        }
        tl.to(sq, { scaleX: 0.9, scaleY: 1.12, duration: 0.12, ease: "sine.inOut" }, T6 - 0.1);

        // Beat 6: the brake. Drops onto the final "}" row, lands on beat 6.5.
        var DROP = T_LAND - T6;
        tl.to(pos, { x: LAND.x - FX, duration: DROP, ease: "power2.out" }, T6);
        tl.to(pos, { y: LAND.y - FY, duration: DROP, ease: "power2.in" }, T6);
        tl.to(spin, { rotation: -720, duration: DROP - 0.03, ease: "power2.out" }, T6);
        tl.to(sq, { scaleX: 0.84, scaleY: 1.22, duration: DROP - 0.02, ease: "power1.in" }, T6 + 0.02);
        // Heavy squash, the page thuds.
        tl.to(sq, { scaleX: 1.55, scaleY: 0.48, duration: 0.05, ease: "power3.out" }, T_LAND);
        tl.to(sq, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "back.out(2)" }, T_LAND + 0.05);
        tl.fromTo(thud, { y: 0 }, { y: 12, duration: 0.04, ease: "power2.out", immediateRender: false }, T_LAND);
        tl.to(thud, { y: 0, duration: 0.3, ease: "power3.out" }, T_LAND + 0.04);
        // Dizzy wobble, damped over a beat.
        var WOB = [8, -6.5, 4.5, -3, 1.5, 0];
        for (var wb = 0; wb < WOB.length; wb++) {
          tl.to(lean, { rotation: WOB[wb], duration: 0.08, ease: "sine.inOut" }, T_LAND + 0.06 + wb * 0.08);
        }

        // ---- Beat 7: "Readable?" slams; the page dims behind the words; Amigo bobs.
        tl.fromTo($("dim"), { opacity: 0 }, { opacity: 0.5, duration: 0.3, ease: "power2.out", immediateRender: false }, T7);
        tl.fromTo($("say-1"), { opacity: 0, scale: 1.45, y: -18 },
          { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, T7 - 0.04);
        tl.fromTo(cam, { x: 0 }, { x: -8, duration: 0.04, ease: "none", immediateRender: false }, T7);
        tl.to(cam, { x: 0, duration: 0.24, ease: "power3.out" }, T7 + 0.04);
        tl.to(sq, { scaleX: 1.12, scaleY: 0.88, duration: 0.06, ease: "power2.out" }, T7 + 0.02);
        tl.to(sq, { scaleX: 1, scaleY: 1, duration: 0.2, ease: "power2.out" }, T7 + 0.08);

        // ---- Beat 8: "Barely." lands under it; Amigo leans toward the words, skeptical, and bobs.
        var T8 = beat(8);
        tl.fromTo($("say-2"), { opacity: 0, x: 70 },
          { opacity: 1, x: 0, duration: 0.28, ease: "expo.out", immediateRender: false }, T8 - 0.04);
        tl.to(sq, { scaleX: 1.12, scaleY: 0.88, duration: 0.06, ease: "power2.out" }, T8);
        tl.to(sq, { scaleX: 1, scaleY: 1, duration: 0.12, ease: "power2.out" }, T8 + 0.06);
        // A disapproving slump under the slow blink, back to true proportions by 3.75.
        tl.to(sq, { scaleX: 1.03, scaleY: 0.92, duration: 0.1, ease: "power2.out" }, T8 + 0.18);
        tl.to(sq, { scaleX: 1, scaleY: 1, duration: 0.14, ease: "power2.inOut" }, T8 + 0.32);
        tl.to(lean, { rotation: 13, duration: 0.3, ease: "power3.out" }, T8);
        tl.to(pos, { x: LAND.x - FX + 14, duration: 0.2, ease: "power2.inOut" }, T8 + HALF);
        tl.to(lean, { rotation: 9, duration: 0.2, ease: "power2.inOut" }, T8 + HALF);

        // ---- Amigo's eye: the masked aperture. Every change is an explicit fromTo from the tracked state.
        var ap = $("ap"), legL = $("legL"), legR = $("legR");
        var EYE = function (w, h, rx, gx, gy) {
          return { x: +(16 - w / 2 + (gx || 0)).toFixed(3), y: +(11.65 - h / 2 + (gy || 0)).toFixed(3), width: w, height: h, rx: rx };
        };
        var REST = [10.2, 5.3, 2.3], WIDE = [11.6, 7.6, 3.2], STRETCH = [10.6, 8.6, 3.2], TINY = [4.2, 2.8, 1.4];
        var SHUT = [10.2, 0.5, 0.25], SQUEEZE = [9.2, 0.5, 0.25], HALFOPEN = [8.8, 2.6, 1.2];
        var SQUINT = [10.2, 1.6, 0.8], LID = [10.2, 0.5, 0.25];
        var eyeCur = EYE(SHUT[0], SHUT[1], SHUT[2], 0, 0);
        gsap.set(ap, { attr: eyeCur });
        var eye = function (t, st, gx, gy, dur, ease) {
          var nx = EYE(st[0], st[1], st[2], gx, gy);
          tl.fromTo(ap, { attr: eyeCur }, { attr: nx, duration: dur, ease: ease || "power2.out", immediateRender: false }, t);
          eyeCur = nx;
        };
        // Pops up: shut to wide, two fast blinks coming to, eyes down on the JSON.
        eye(beat(1.5), WIDE, 0, 0.6, 0.06, "power2.out");
        eye(0.30, [11.6, 0.6, 0.3], 0, 0.6, 0.035, "power2.in");
        eye(0.335, WIDE, 0, 0.8, 0.04, "power2.out");
        eye(0.385, [11.0, 0.6, 0.3], 0, 1.0, 0.03, "power2.in");
        eye(0.415, REST, 0, 1.2, 0.05, "power2.out");
        // The scroll starts: uh-oh. Tiny eye darting down.
        eye(T2, TINY, 0, 1.3, 0.08, "power2.out");
        eye(T2 + 0.11, TINY, -1.9, 1.4, 0.05, "power2.inOut");
        eye(T2 + 0.17, TINY, 1.7, 1.3, 0.05, "power2.inOut");
        // Edge yanked away: wide and stretched for the fall.
        eye(T_LEAVE, STRETCH, 0, -0.6, 0.09, "power2.out");
        eye(beat(4), STRETCH, 0.8, 0.2, 0.18, "sine.inOut");
        eye(beat(4.5), STRETCH, -0.6, -0.4, 0.18, "sine.inOut");
        // The fastest stretch of the rush: squeezed shut mid-spin.
        eye(beat(5), SQUEEZE, 0, 0, 0.1, "power2.in");
        // The brake: pops open at the floor, shut on impact.
        eye(T6 + 0.03, WIDE, 0, 1.4, 0.06, "power2.out");
        eye(T_LAND - 0.03, SHUT, 0, 0, 0.03, "power2.in");
        // Dazed: half open, gaze wobbling left-right for a beat.
        eye(T_LAND + 0.14, HALFOPEN, -1.4, 0.2, 0.12, "power2.out");
        eye(T_LAND + 0.26, HALFOPEN, 1.4, 0.3, 0.11, "sine.inOut");
        eye(T_LAND + 0.37, HALFOPEN, -1.0, 0.2, 0.1, "sine.inOut");
        // Beat 7.5 (the take after "Readable?" slams): snaps to the words, flat skeptical squint.
        eye(T7 + HALF, SQUINT, 2.1, -1.2, 0.08, "power3.out");
        // Beat 8, "Barely.": a slow disapproving blink.
        eye(T8 + 0.02, LID, 2.1, -1.0, 0.15, "power2.in");
        eye(T8 + 0.25, SQUINT, 2.1, -1.2, 0.2, "power2.out");

        // Tremble while the page creeps (deterministic x jitter on the lean layer).
        var TREM = [-3, 2.6, -2.2, 3, -2.6, 2, -1.4, 0];
        var tremPrev = 0;
        for (var tr = 0; tr < TREM.length; tr++) {
          tl.fromTo(lean, { x: tremPrev }, { x: TREM[tr], duration: 0.028, ease: "none", immediateRender: false }, T2 + 0.03 + tr * 0.028);
          tremPrev = TREM[tr];
        }
        // Legs kick with the flail, then hang straight for the fall.
        var KICK = [-1.4, 1.0, -1.4, 1.0, 0];
        var kPrev = 0;
        for (var kk = 0; kk < KICK.length; kk++) {
          var kt = kk < 4 ? T_LEAVE + 0.02 + kk * 0.055 : beat(3);
          tl.fromTo(legL, { y: kPrev }, { y: KICK[kk], duration: kk < 4 ? 0.055 : 0.1, ease: "sine.inOut", immediateRender: false }, kt);
          tl.fromTo(legR, { y: -kPrev }, { y: -KICK[kk], duration: kk < 4 ? 0.055 : 0.1, ease: "sine.inOut", immediateRender: false }, kt);
          kPrev = KICK[kk];
        }

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
