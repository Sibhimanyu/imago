    <script>
      (function () {
        var ID = "05-drop";
        var scope = document.querySelector('[data-composition-id="' + ID + '"]') || document;
        var $ = function (s) { return scope.querySelector("#f05-" + s); };

        var tl = gsap.timeline({ paused: true });

        // 128 bpm grid: frame-local beat n = n * 0.469 (beat 0 = the drop).
        var BEAT = 0.469, HALF = 0.2345;
        var beat = function (n) { return n * BEAT; };

        // Deck geometry (card box 880x495 centred at DX, DY).
        var DX = 1310, DY = 470, W = 880, H = 495, N = 8;
        var DEG = Math.PI / 180;
        var frac = function (v) { return v - Math.floor(v); };
        var prand = function (i, k) { return frac(Math.sin(i * 12.9898 + k * 78.233) * 43758.5453); };

        // Pile slots: index-derived offset + rotation (+-2..6 deg, alternating sign), rising as it grows.
        var pile = [];
        for (var i = 0; i < N; i++) {
          var sign = i % 2 ? 1 : -1;
          var rot = i === 0 ? -4 : sign * (2 + prand(i, 1) * 4);
          pile.push({ x: (prand(i, 2) - 0.5) * 44, y: -i * 8, r: rot, s: 1 });
        }
        // Fan slots: arc around a pivot below the deck.
        var FAN_S = 0.64, R = 1100, FAN_Y = 44;
        var fan = [];
        for (var j = 0; j < N; j++) {
          var a = -12.25 + 3.5 * j;
          fan.push({ x: -20 + R * Math.sin(a * DEG), y: FAN_Y + R * (1 - Math.cos(a * DEG)), r: a, s: FAN_S });
        }
        // Top-centre point of a card slot (where Amigo's feet go).
        var topOf = function (p) {
          var hh = (H / 2) * p.s;
          return { x: DX + p.x + hh * Math.sin(p.r * DEG), y: DY + p.y - hh * Math.cos(p.r * DEG), r: p.r };
        };

        var card = function (k) { return $("card-" + k); };
        var dim = function (k) { return $("dim-" + k); };

        // ---- Scene 1 (0.0s): the drop. Ink flips to paper, Pikachu slams in huge from below-front.
        tl.fromTo($("ink"), { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power2.out" }, 0);
        tl.fromTo(card(0),
          { x: pile[0].x + 120, y: 760, rotation: -12, scale: 1.45 },
          { x: pile[0].x, y: pile[0].y, rotation: pile[0].r, scale: 1, duration: 0.42, ease: "expo.out" }, 0);
        tl.fromTo($("l1"), { x: -160, scale: 1.25, opacity: 0 },
          { x: 0, scale: 1, opacity: 1, duration: 0.36, ease: "expo.out" }, 0);
        // hide the rest of the deck until its beat
        for (var h = 1; h < N; h++) tl.set(card(h), { opacity: 0 }, 0);

        // Deck impact dip on every landing (UI: power3 settle, no overshoot).
        var dip = function (t, amt) {
          tl.fromTo($("deck"), { y: amt }, { y: 0, duration: 0.26, ease: "power3.out", immediateRender: false }, t);
        };
        dip(0.06, 14);

        // ---- Scene 2 (beats 1-6): one card per beat from alternating sides, landing on the pile.
        for (var c = 1; c <= 6; c++) {
          var fromRight = c % 2 === 1;
          var land = beat(c);
          var p = pile[c];
          tl.set(card(c), { opacity: 1 }, land - 0.05);
          tl.fromTo(card(c),
            { x: p.x + (fromRight ? 1350 : -1350), y: p.y + 240, rotation: p.r + (fromRight ? 18 : -18), scale: 1.08 },
            { x: p.x, y: p.y, rotation: p.r, scale: 1, duration: 0.38, ease: "expo.out", immediateRender: false }, land - 0.05);
          tl.fromTo(dim(c - 1), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, land);
          dip(land, 10);
        }

        // "it returns." completes the headline on beat 2 (the third beat).
        tl.fromTo($("l2"), { y: 70, scale: 1.2, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.34, ease: "expo.out" }, beat(2) - 0.03);

        // ---- Scene 3 (beat 7): Charizard slams, the deck fans into an arc.
        var FAN_AT = beat(7);
        var f7 = fan[7];
        tl.set(card(7), { opacity: 1 }, FAN_AT - 0.05);
        tl.fromTo(card(7),
          { x: f7.x + 1200, y: f7.y + 260, rotation: f7.r + 20, scale: 0.7 },
          { x: f7.x, y: f7.y, rotation: f7.r, scale: f7.s, duration: 0.36, ease: "expo.out", immediateRender: false }, FAN_AT - 0.05);
        for (var m = 0; m < 7; m++) {
          var q = fan[m];
          tl.to(card(m), { x: q.x, y: q.y, rotation: q.r, scale: q.s, duration: 0.3, ease: "power3.out" }, FAN_AT + m * 0.008);
          tl.to(dim(m), { opacity: 0, duration: 0.2, ease: "power2.out" }, FAN_AT);
        }
        tl.fromTo($("label"), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, FAN_AT + 0.06);

        // ---- Amigo rig: pos (x,y) > lean (surf, follows the card) > react (body language)
        //      > spin > squash (feet-anchored) > svg [legs | masked body with a tweenable aperture].
        var amigo = $("amigo"), lean = $("lean"), react = $("react"), spin = $("spin"), sq = $("squash");
        var ap = $("ap"), legs = [$("legL"), $("legR")];
        var feet = function (pt) { return { x: pt.x - 55, y: pt.y - 110 }; };

        // Each channel is a chronological chain of fromTo tweens: every "from" is the previous "to",
        // the first renders immediately, the rest are immediateRender:false (seek-safe).
        var chain = function (target, start, wrap) {
          var cur = start, first = true;
          var go = function (t, dur, patch, ease) {
            var next = {};
            for (var k in cur) next[k] = cur[k];
            for (var p in patch) next[p] = patch[p];
            var fv = wrap(cur), tv = wrap(next);
            tv.duration = dur; tv.ease = ease || "power2.inOut"; tv.immediateRender = first;
            tl.fromTo(target, fv, tv, t);
            first = false; cur = next;
          };
          return go;
        };
        var plain = function (o) { var r = {}; for (var k in o) r[k] = o[k]; return r; };

        // Aperture: every state is centred on (16, 11.65); gx/gy is the gaze offset.
        var CX = 16, CY = 11.65;
        var REST = { w: 10.2, h: 5.3, rx: 2.3 }, SQUINT = { w: 10.2, h: 2.0, rx: 1.0 },
            WIDE = { w: 11.6, h: 7.6, rx: 3.2 }, SHUT = { w: 10.2, h: 0.5, rx: 0.25 },
            BLINK = { w: 10.2, h: 0.6, rx: 0.3 }, AWED = { w: 11.0, h: 6.6, rx: 2.9 };
        var eyeAttr = function (s) {
          return { attr: { x: CX - s.w / 2 + s.gx, y: CY - s.h / 2 + s.gy, width: s.w, height: s.h, rx: s.rx } };
        };
        var mix = function (state, gx, gy) { return { w: state.w, h: state.h, rx: state.rx, gx: gx || 0, gy: gy || 0 }; };
        var eye = chain(ap, mix(WIDE), eyeAttr);
        var body = chain(sq, { scaleX: 0.84, scaleY: 1.2 }, plain);
        var turn = chain(react, { rotation: 0, x: 0 }, plain);
        var legY = chain(legs, { y: 0 }, plain);

        var P = function (k) { return topOf(pile[k]); };
        var landSquash = function (t, wide) {
          body(t, 0.001, { scaleX: 1.15, scaleY: 0.88 }, "none");
          body(t + 0.001, 0.05, { scaleX: wide ? 1.38 : 1.26, scaleY: wide ? 0.66 : 0.74 }, "power2.out");
          if (!wide) body(t + 0.051, 0.13, { scaleX: 1, scaleY: 1 }, "back.out(2)");
        };

        // Beat 0-1 — the drop: thrilled WIDE eye, stamps down onto Forecast as it lands.
        eye(0, 0.001, mix(WIDE), "none");
        var f1 = feet(P(1));
        tl.fromTo(amigo, { x: f1.x, y: -260, opacity: 1 }, { x: f1.x, y: f1.y, duration: 0.24, ease: "power3.in" }, beat(1) - 0.24);
        tl.fromTo(lean, { rotation: 0 }, { rotation: pile[1].r, duration: 0.24, ease: "none" }, beat(1) - 0.24);
        turn(0, 0.001, { rotation: 0, x: 0 }, "none");
        legY(0, 0.001, { y: -1.2 }, "none");                       // legs tucked in the fall
        body(beat(1) - 0.24, 0.2, { scaleX: 0.9, scaleY: 1.12 }, "none");
        legY(beat(1) - 0.04, 0.04, { y: 0 }, "power2.out");
        landSquash(beat(1), false);
        eye(0.6, 0.16, mix(REST));                                  // thrill settles to rest

        // Ride: the new card slides in under Amigo and carries it up (no hop), leaning with the card.
        var ride = function (k) {
          var A = feet(P(k - 1)), B = feet(P(k)), t = beat(k);
          tl.fromTo(amigo, { x: A.x }, { x: B.x, duration: 0.14, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo(amigo, { y: A.y }, { y: B.y - 9, duration: 0.07, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo(amigo, { y: B.y - 9 }, { y: B.y, duration: 0.09, ease: "power2.in", immediateRender: false }, t + 0.07);
          tl.fromTo(lean, { rotation: pile[k - 1].r }, { rotation: pile[k].r, duration: 0.16, ease: "power2.out", immediateRender: false }, t);
        };

        // Beat 2 — Currency flies in from the LEFT. Gaze snaps left, then a delighted squint.
        eye(0.77, 0.07, mix(REST, -2.2, 0.3), "power2.out");
        turn(0.77, 0.07, { rotation: -3 }, "power2.out");
        ride(2);
        eye(beat(2), 0.1, mix(SQUINT), "power2.out");
        turn(beat(2), 0.08, { rotation: 4 }, "power2.out");
        body(beat(2) + 0.18, 0.08, { scaleX: 0.96, scaleY: 1.06 }, "power2.out");   // happy perk
        body(beat(2) + 0.26, 0.14, { scaleX: 1, scaleY: 1 }, "power2.inOut");
        turn(beat(2) + 0.08, 0.14, { rotation: 0 }, "power2.inOut");
        eye(1.21, 0.07, mix(REST), "power2.inOut");

        // Beat 3 — card from the RIGHT. Gaze snaps right, then a surprised widen and a shrink-back.
        eye(1.28, 0.07, mix(REST, 2.2, 0.3), "power2.out");
        turn(1.28, 0.07, { rotation: 3 }, "power2.out");
        ride(3);
        eye(beat(3) - 0.02, 0.08, mix(WIDE, 1.2, 0), "power2.out");
        turn(beat(3) - 0.02, 0.1, { rotation: -7, x: -6 }, "power2.out");
        body(beat(3) - 0.02, 0.07, { scaleX: 0.95, scaleY: 1.07 }, "power2.out");
        body(beat(3) + 0.05, 0.12, { scaleX: 1, scaleY: 1 }, "power2.inOut");
        // glance left at the next card as it winds up...
        eye(1.50, 0.1, mix(REST, -2.2, 0.3), "power2.inOut");
        turn(1.52, 0.12, { rotation: 0, x: 0 }, "power2.inOut");

        // Beat 4 — the one travelling move: a spinning hop onto the card from the LEFT, eye squeezed shut.
        (function () {
          var t0 = beat(3) + HALF - 0.01, t1 = beat(4), air = t1 - t0;
          var a = P(3), b = P(4), A = feet(a), B = feet(b);
          eye(t0 - 0.03, 0.05, mix(SHUT), "power2.in");
          body(t0 - 0.05, 0.05, { scaleX: 1.12, scaleY: 0.86 }, "power2.out");
          body(t0, 0.07, { scaleX: 0.86, scaleY: 1.18 }, "power2.out");
          body(t0 + 0.07, air * 0.4, { scaleX: 1, scaleY: 1 }, "power1.inOut");
          legY(t0, 0.06, { y: -1.2 }, "power2.out");
          tl.fromTo(amigo, { x: A.x }, { x: B.x, duration: air, ease: "none", immediateRender: false }, t0);
          var top = Math.min(A.y, B.y) - 70;
          tl.fromTo(amigo, { y: A.y }, { y: top, duration: air / 2, ease: "power2.out", immediateRender: false }, t0);
          tl.fromTo(amigo, { y: top }, { y: B.y, duration: air / 2, ease: "power2.in", immediateRender: false }, t0 + air / 2);
          tl.fromTo(lean, { rotation: a.r }, { rotation: b.r, duration: air, ease: "power1.inOut", immediateRender: false }, t0);
          tl.fromTo(spin, { rotation: 0 }, { rotation: 360, duration: air * 0.9, ease: "power2.inOut", immediateRender: false }, t0 + air * 0.05);
          legY(t1 - 0.04, 0.04, { y: 0 }, "power2.out");
          landSquash(t1, false);
          eye(t1, 0.08, mix(WIDE), "power2.out");                   // pops open wide on landing
          eye(2.1, 0.12, mix(REST), "power2.inOut");
        })();

        // Beat 5 — card from the RIGHT. Gaze right, then a quick double blink and a foot tap.
        eye(2.22, 0.07, mix(REST, 2.2, 0.3), "power2.out");
        turn(2.22, 0.07, { rotation: 3 }, "power2.out");
        ride(5);
        turn(beat(5), 0.1, { rotation: 0 }, "power2.out");
        eye(beat(5), 0.05, mix(BLINK), "power2.in");
        eye(beat(5) + 0.05, 0.07, mix(REST), "power2.out");
        eye(2.50, 0.05, mix(BLINK), "power2.in");
        eye(2.55, 0.08, mix(REST), "power2.out");
        body(beat(5), 0.06, { scaleX: 1.06, scaleY: 0.94 }, "power2.out");
        body(beat(5) + 0.06, 0.12, { scaleX: 1, scaleY: 1 }, "power2.inOut");
        tl.fromTo(legs[1], { y: 0 }, { y: -1.4, duration: 0.06, ease: "power2.out", immediateRender: false }, beat(5) + 0.1);
        tl.fromTo(legs[1], { y: -1.4 }, { y: 0, duration: 0.08, ease: "power2.in", immediateRender: false }, beat(5) + 0.16);

        // Beat 6 — card from the LEFT. Gaze left, then an impressed lean-back, eye raised and open.
        eye(2.64, 0.07, mix(REST, -2.2, 0.3), "power2.out");
        turn(2.64, 0.07, { rotation: -3 }, "power2.out");
        ride(6);
        eye(beat(6), 0.12, mix(AWED, -1.0, -0.9), "power2.out");
        turn(beat(6), 0.14, { rotation: 9, x: 5 }, "power2.out");
        turn(3.0, 0.18, { rotation: 0, x: 0 }, "power2.inOut");

        // Charge-up on Sunrise with a determined squint locked on the fan's top card, then the launch.
