    <script>
      (function () {
        var ID = "06-plan";

        var scope = document.querySelector('[data-composition-id="' + ID + '"]') || document;
        var $ = function (s) { return scope.querySelector("#f06-" + s); };

        var tl = gsap.timeline({ paused: true });

        // 128 bpm grid, packet beats are 1-indexed: beat n = (n - 1) * 0.469.
        var BEAT = 0.469, HALF = 0.2345;
        var b = function (n) { return (n - 1) * BEAT; };

        // ================= the plan panel: discrete typing =================
        var LINES = [
          '{"layout": "profile",',
          ' "title": "name",',
          ' "components": [',
          '  {"type": "stat", "field": "base_experience"},',
          '  {"type": "bars", "field": "stats"},',
          '  {"type": "badges", "field": "types"}',
          " ]}"
        ];
        // [start, duration] of each line's typing; header lines are already on screen.
        var TYPE = [
          [-1, 0], [-1, 0], [-1, 0],
          [b(1) + 0.02, 0.34],
          [b(2) + 0.01, 0.28],
          [b(3) + 0.01, 0.30],
          [1.30, 0.04]
        ];
        var hl = function (s) { return s.replace(/"[^"]*"/g, function (m) { return '<span class="f06-s">' + m + "</span>"; }); };
        var txtEls = [], cache = [];
        for (var i = 0; i < LINES.length; i++) { txtEls.push($("t" + i)); cache.push(null); }
        var caret = $("caret");
        var caretLine = -1;
        var renderPanel = function (t) {
          var active = 0;
          for (var i = 0; i < LINES.length; i++) {
            var st = TYPE[i][0], du = TYPE[i][1], n;
            if (st < 0 || t >= st + du) n = LINES[i].length;
            else if (t < st) n = 0;
            else n = Math.floor(((t - st) / du) * LINES[i].length);
            if (n > 0) active = i;
            if (cache[i] !== n) { cache[i] = n; txtEls[i].innerHTML = hl(LINES[i].substring(0, n)); }
          }
          if (caretLine !== active) { caretLine = active; $("ln" + active).appendChild(caret); }
        };
        var driver = { t: 0 };
        tl.fromTo(driver, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { renderPanel(driver.t); } }, 0);
        renderPanel(0);
        // caret blink: deterministic square wave, ~0.6s period
        var blink = { p: 0 };
        tl.fromTo(blink, { p: 0 }, {
          p: Math.PI * 2 * (DUR / 0.6), duration: DUR, ease: "none",
          onUpdate: function () {
            var typing = driver.t < 1.36;
            caret.style.opacity = typing || Math.sin(blink.p) > 0 ? "1" : "0";
          }
        }, 0);

        // ================= headline (discrete word lands, waterfall cut) =================
        var A = [], B = [];
        for (var a = 0; a < 7; a++) A.push($("a" + a));

        for (var w = 0; w < 5; w++) {

        }

          tl.fromTo(A[w2], { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "expo.out" }, b(2) + (w2 - 5) * 0.05);
        }
        // Beat 5: waterfall. Exits rip left in reading order; the last word's fade ends on the cut.
        var CUT = b(5);
        for (var e = 0; e < 7; e++) {
          var st = CUT - 0.18 - (6 - e) * 0.022;
          tl.fromTo(A[e], { x: 0 }, { x: -230, duration: 0.34, ease: "power4.in", immediateRender: false }, st);
          tl.to(A[e], { opacity: 0, duration: 0.18, ease: "power1.in" }, st);
        }
        for (var n2 = 0; n2 < 5; n2++) {
          tl.set(B[n2], { opacity: 0 }, 0);
          tl.fromTo(B[n2], { x: 230, opacity: 0.35 }, { x: 0, opacity: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, CUT + n2 * 0.022);
        }

        // ================= card: the stamps leave live components =================
        var card = $("card");
        tl.set([$("comp1"), $("comp2"), $("comp3")], { opacity: 0 }, 0);
        for (var f = 0; f < 6; f++) tl.set($("fill" + f), { scaleX: 0 }, 0);
        for (var d = 3; d <= 5; d++) tl.set($("dot" + d), { scale: 0 }, 0);

        var cardDip = function (t) {
          tl.fromTo(card, { y: 10 }, { y: 0, duration: 0.26, ease: "power3.out", immediateRender: false }, t);
        };
        // the coupled plan line lights up and gets a live dot in the same beat
        var couple = function (t, line) {
          tl.fromTo($("band" + line), { opacity: 1 }, { opacity: 0.25, duration: 0.4, ease: "power3.out", immediateRender: false }, t);
          tl.fromTo($("dot" + line), { scale: 0 }, { scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, t);
        };
        var reveal = function (t, k) {
          tl.to($("well" + k), { opacity: 0, duration: 0.14, ease: "power2.out" }, t);
          tl.fromTo($("comp" + k), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.36, ease: "expo.out", immediateRender: false }, t);

        chan("legR", legR, { y: 0 });

        var hop = function (t0, t1, to, apexFeet, stamp) {
