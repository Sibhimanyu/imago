<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter Display"; src: url("assets/fonts/InterDisplay-SemiBold.otf") format("opentype"); font-weight: 600; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Regular.otf") format("opentype"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Medium.otf") format("opentype"); font-weight: 500; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-Regular.ttf") format("truetype"); font-weight: 400; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f6f5f1; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f5f1; color: #1b1b19; font-family: "Inter", sans-serif; }
      .bg { position: absolute; left: 0; top: -96px; width: 1080px; height: 2112px; background-image: radial-gradient(circle, #e2dfd7 2.4px, transparent 2.6px); background-size: 48px 48px; }
      .chrome { position: absolute; left: 72px; right: 72px; top: 112px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 16px; font-family: "Inter Display", sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -0.02em; }
      .brand svg { width: 56px; height: 56px; display: block; }
      .url-meta { font-family: "JetBrains Mono", monospace; font-size: 28px; color: #66655f; }
      .scene { position: absolute; inset: 0; }
      .wrap { position: absolute; inset: 0; }
      .h1 { font-family: "Inter Display", sans-serif; font-weight: 600; letter-spacing: -0.035em; line-height: 1.02; color: #1b1b19; }
      .sub { font-family: "Inter", sans-serif; font-weight: 400; color: #66655f; line-height: 1.3; }

      /* Scene A: the anagram */
      #a-amigo { position: absolute; left: 330px; top: 330px; width: 420px; height: 420px; }
      #a-amigo img { width: 100%; height: 100%; display: block; }
      #a-word { position: absolute; left: 0; right: 0; top: 820px; display: flex; justify-content: center; }
      #a-letters { position: relative; display: flex; font-family: "Inter Display", sans-serif; font-weight: 600; font-size: 250px; letter-spacing: -0.03em; line-height: 1; }
      #a-letters span { display: block; }
      #a-rule { position: absolute; left: 180px; width: 720px; top: 1150px; height: 4px; background: #1b1b19; transform-origin: left center; }
      #a-caption { position: absolute; left: 110px; right: 110px; top: 1210px; font-family: "Inter", sans-serif; font-weight: 500; font-size: 62px; line-height: 1.22; letter-spacing: -0.015em; text-align: center; color: #1b1b19; }
      #a-caption .muted { color: #66655f; font-weight: 400; }
      #a-caption span.line { display: block; }

      /* Scene B: paste a URL */
      #b-head { position: absolute; left: 64px; right: 40px; top: 270px; }
      #b-head { font-size: 82px; }
      #b-l1, #b-l2 { display: block; }
      #b-card { position: absolute; left: 120px; top: 530px; width: 840px; height: 1180px; background: #ffffff; border: 3px solid #e7e5df; border-radius: 44px; overflow: hidden; box-shadow: 0 40px 90px rgba(27, 27, 25, 0.10); }
      #b-card img { position: absolute; left: 0; top: 0; width: 834px; height: 1483px; display: block; }
      #b-tag { position: absolute; left: 150px; top: 1570px; padding: 14px 26px; border-radius: 100px; background: #1b1b19; color: #f6f5f1; font-family: "JetBrains Mono", monospace; font-size: 28px; }
      #b-amigo { position: absolute; left: 800px; top: 1490px; width: 230px; height: 230px; }
      #b-amigo img { width: 100%; height: 100%; display: block; }

      /* End card */
      #e-logo { position: absolute; left: 60px; top: 690px; width: 960px; height: 360px; }
      #e-logo img { width: 100%; height: 100%; display: block; }
      #e-url { position: absolute; left: 0; right: 0; top: 1090px; text-align: center; font-family: "JetBrains Mono", monospace; font-size: 50px; color: #1b1b19; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17.4" data-width="1080" data-height="1920">
      <div class="bg" id="bg"></div>

      <section id="scene-a" class="scene clip" data-start="0" data-duration="7.4" data-track-index="1">
        <div class="wrap" id="a-wrap">
          <div class="chrome" id="a-chrome">
            <div class="brand"><svg viewBox="0 0 32 32"><g fill="#1b1b19"><rect x="4.2" y="6.4" width="12.8" height="6" rx="3"/><rect x="3" y="14.3" width="11.5" height="6" rx="3"/><path fill-rule="evenodd" d="M13.6 6.4h8c4.4 0 7 2.9 7 7.3v7.1c0 4.2-2.7 6.8-6.9 6.8h-8.1c-3.8 0-6-2.3-6-6.1v-9c0-3.8 2.2-6.1 6-6.1Zm7.8 6.2c-1.4 0-2.3.9-2.3 2.3v4.4c0 1.4.9 2.3 2.3 2.3h.7c1.4 0 2.3-.9 2.3-2.3v-4.4c0-1.4-.9-2.3-2.3-2.3h-.7Z"/></g></svg>Imago</div>
            <div class="url-meta">imago.onslate.in</div>
          </div>
          <div id="a-amigo"><img src="assets/amigo.svg" alt="Amigo" /></div>
          <div id="a-word"><div id="a-letters"><span id="l-i">i</span><span id="l-m">m</span><span id="l-a">a</span><span id="l-g">g</span><span id="l-o">o</span></div></div>
          <div id="a-rule"></div>
          <div id="a-caption"><span class="line" id="a-cap1">Swap two letters and imago becomes amigo,</span><span class="line muted" id="a-cap2">Spanish for friend.</span></div>
        </div>
      </section>

      <section id="scene-b" class="scene clip" data-start="7.4" data-duration="6.8" data-track-index="1">
        <div class="wrap" id="b-wrap">
          <div class="chrome">
            <div class="brand"><svg viewBox="0 0 32 32"><g fill="#1b1b19"><rect x="4.2" y="6.4" width="12.8" height="6" rx="3"/><rect x="3" y="14.3" width="11.5" height="6" rx="3"/><path fill-rule="evenodd" d="M13.6 6.4h8c4.4 0 7 2.9 7 7.3v7.1c0 4.2-2.7 6.8-6.9 6.8h-8.1c-3.8 0-6-2.3-6-6.1v-9c0-3.8 2.2-6.1 6-6.1Zm7.8 6.2c-1.4 0-2.3.9-2.3 2.3v4.4c0 1.4.9 2.3 2.3 2.3h.7c1.4 0 2.3-.9 2.3-2.3v-4.4c0-1.4-.9-2.3-2.3-2.3h-.7Z"/></g></svg>Imago</div>
            <div class="url-meta">imago.onslate.in</div>
          </div>
          <div id="b-head" class="h1"><span id="b-l1">Paste an API URL.</span><span id="b-l2">Get an interface, not JSON.</span></div>
          <div id="b-card">
            <img data-layout-allow-overflow id="b-json" src="assets/pika-raw.png" alt="Imago inspector showing the raw Pikachu JSON" />
            <img data-layout-allow-overflow id="b-page" src="assets/pika.png" alt="The page Imago drew for Pikachu" />
          </div>
          <div id="b-tag">pokeapi.co/api/v2/pokemon/pikachu</div>
          <div id="b-amigo"><img src="assets/amigo.svg" alt="Amigo" /></div>
        </div>
      </section>

      <section id="scene-e" class="scene clip" data-start="14.2" data-duration="3.2" data-track-index="1">
        <div class="wrap" id="e-wrap">
          <div id="e-logo"><img src="assets/logo-primary.svg" alt="Imago" /></div>
          <div id="e-url">imago.onslate.in</div>
        </div>
      </section>
    </div>
    <script>
      document.fonts.ready.then(function () {
        const tl = gsap.timeline({ paused: true });
        const D = 17.4;

        // Ambient: the dot field drifts one cell over the whole piece (sine-wave-loop, finite).
        tl.fromTo("#bg", { y: 0 }, { y: 48, duration: D, ease: "none" }, 0);

        // ---- Scene A: Amigo arrives, the word swaps into amigo ----
        tl.fromTo("#a-chrome", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
        tl.fromTo("#a-amigo", { scale: 0.4, opacity: 0, y: 60 }, { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.7)" }, 0.15);
        // idle bob, finite repeats
        tl.fromTo("#a-amigo", { y: 0 }, { y: -14, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 6, immediateRender: false }, 0.9);
        tl.fromTo("#a-letters span", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out", stagger: 0.07 }, 0.55);

        // Letter swap: i <-> a, m shifts by the width difference. Measured once, fonts loaded, scene visible at t=0.
        const li = document.getElementById("l-i"), lm = document.getElementById("l-m"), la = document.getElementById("l-a");
        const wi = li.offsetWidth, wm = lm.offsetWidth, wa = la.offsetWidth;
        const T = 2.1;
        tl.to("#l-i", { x: wa + wm, duration: 1.0, ease: "power2.inOut" }, T);
        tl.to("#l-i", { y: -110, duration: 0.5, ease: "sine.out" }, T);
        tl.to("#l-i", { y: 0, duration: 0.5, ease: "sine.in" }, T + 0.5);
        tl.to("#l-a", { x: -(wi + wm), duration: 1.0, ease: "power2.inOut" }, T);
        tl.to("#l-a", { y: 90, duration: 0.5, ease: "sine.out" }, T);
        tl.to("#l-a", { y: 0, duration: 0.5, ease: "sine.in" }, T + 0.5);
        tl.to("#l-m", { x: wa - wi, duration: 1.0, ease: "power2.inOut" }, T);
        // Amigo reacts to its name with a small hop
        tl.to("#a-amigo", { scale: 1.08, duration: 0.18, ease: "power2.out" }, T + 1.0);
        tl.to("#a-amigo", { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.5)" }, T + 1.18);

        tl.fromTo("#a-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 3.3);
        tl.fromTo("#a-cap1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 3.5);
        tl.fromTo("#a-cap2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 4.1);
        tl.to("#a-wrap", { opacity: 0, duration: 0.35, ease: "power1.in" }, 7.05);

        // ---- Scene B: paste a URL, get an interface ----
        const B = 7.4;
        tl.fromTo("#b-wrap", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, B);
        tl.fromTo("#b-l1", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, B + 0.15);
        tl.fromTo("#b-card", { y: 260, opacity: 0, rotation: 2 }, { y: 0, opacity: 1, rotation: 0, duration: 0.8, ease: "power3.out" }, B + 0.3);
        tl.fromTo("#b-tag", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, B + 0.9);
        // the raw JSON scrolls a little: a wall of text
        tl.fromTo("#b-json", { y: 0 }, { y: -180, duration: 2.2, ease: "power1.inOut" }, B + 0.9);
        tl.fromTo("#b-l2", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, B + 2.0);
        // swap to the drawn page
        tl.fromTo("#b-page", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, B + 2.9);
        tl.to("#b-tag", { opacity: 0, y: 20, duration: 0.3, ease: "power1.in" }, B + 2.9);
        // Amigo arrives where Imago helped
        tl.fromTo("#b-amigo", { y: 200, opacity: 0, rotation: -8 }, { y: 0, opacity: 1, rotation: 0, duration: 0.7, ease: "back.out(1.8)" }, B + 3.4);
        tl.fromTo("#b-amigo", { y: 0 }, { y: -10, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, B + 4.2);
        tl.fromTo("#b-page", { y: 0 }, { y: -160, duration: 2.6, ease: "power1.inOut", immediateRender: false }, B + 3.7);
        tl.to("#b-wrap", { opacity: 0, duration: 0.35, ease: "power1.in" }, 13.85);

        // ---- End card ----
        const E = 14.2;
        tl.fromTo("#e-logo", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, E + 0.1);
        tl.fromTo("#e-url", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, E + 0.6);

        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
