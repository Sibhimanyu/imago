name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Unit and regression suites
        run: npm test

      # js/ ships to the browser as native ES modules with no build step, so a
      # syntax error or a missing import is a blank page, not a build failure.
      # This bundles js/main.js (syntax, paths, exports) and checks every name
      # a module uses from another is imported.
      - name: Check the shipped modules
        run: npm run check

      # publish.sh assembles dist/. If it breaks, deploys serve a stale tree.
      - name: Assemble the deploy tree
        run: ./publish.sh

      # The Figma file mirrors what ships. A UI or token change that was not
      # carried into Figma fails here; see DESIGN.md → Figma sync.
      - name: Figma is in sync with the UI
        run: npm run design:check
