name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Unit and regression suites
        run: npm test

      # app.js ships to the browser unbundled, so a syntax error is a blank
      # page rather than a build failure. Check it explicitly.
      - name: Syntax-check the shipped script
        run: node --check app.js

      # publish.sh assembles dist/. If it breaks, deploys serve a stale tree.
      - name: Assemble the deploy tree
        run: ./publish.sh

      # The Figma file mirrors what ships. A UI or token change that was not
      # carried into Figma fails here; see DESIGN.md → Figma sync.
      - name: Figma is in sync with the UI
        run: npm run design:check
